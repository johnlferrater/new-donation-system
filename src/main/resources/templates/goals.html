<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Donation Goals - Donation System', true)}"></head>
<body class="app-body">
  <nav th:replace="~{fragments/layout :: navbar('goals')}"></nav>

  <main class="container app-main">
    <header class="page-header">
      <div class="page-header__copy">
        <p class="page-kicker">Fundraising</p>
        <h1 class="page-title"><i class="bi bi-bullseye me-2"></i>Donation Goals</h1>
        <p class="page-subtitle">Set targets and follow the progress of each fundraising campaign.</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal"
                sec:authorize="hasRole('ADMIN')"><i class="bi bi-plus-lg"></i> Create Goal</button>
      </div>
    </header>

    <div class="card-grid goal-grid" id="goalsContainer">
      <div class="card surface-card text-center text-muted grid-span-all">Loading...</div>
    </div>
  </main>

  <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addGoalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="addGoalTitle">Add New Goal</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="addForm">
            <div class="mb-3">
              <label class="form-label" for="title">Title</label>
              <input type="text" class="form-control" id="title" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="targetAmount">Target Amount (₱)</label>
              <input type="number" class="form-control" id="targetAmount" step="0.01" min="0" required>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="addGoal()">Save Goal</button>
        </div>
      </div>
    </div>
  </div>

  <footer th:replace="~{fragments/layout :: footer}"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function loadGoals() {
      try {
        const goals = await apiFetch('/api/goals');
        const container = document.getElementById('goalsContainer');
        if (goals.length === 0) {
          container.innerHTML = '<div class="card surface-card text-center text-muted grid-span-all">No goals found. Create one to get started.</div>';
          return;
        }
        container.innerHTML = goals.map(g => {
          const target = Number(g.targetAmount) || 0;
          const current = Number(g.currentAmount) || 0;
          const pct = target > 0 ? Math.max(0, Math.min(Math.round((current / target) * 100), 100)) : 0;
          return `<article class="card surface-card">
            <h2 class="h5 mb-3">${escapeHtml(g.title)}</h2>
            <div class="d-flex justify-content-between align-items-baseline gap-2">
              <span class="text-muted small">Target: ₱${target.toLocaleString()}</span>
              <span class="text-primary fw-bold">₱${current.toLocaleString()}</span>
            </div>
            <div class="progress progress-lg mt-3" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${pct}% funded">
              <div class="progress-bar" style="width:${pct}%">${pct}%</div>
            </div>
          </article>`;
        }).join('');
      } catch (e) {
        console.error('Failed to load goals:', e);
        document.getElementById('goalsContainer').innerHTML = '<div class="alert alert-danger grid-span-all">Failed to load goals.</div>';
      }
    }

    async function addGoal() {
      const titleEl = document.getElementById('title');
      const targetEl = document.getElementById('targetAmount');
      const errorEl = document.getElementById('goalFormError');
      const btn = document.getElementById('saveGoalBtn');
      if (errorEl) errorEl.textContent = '';
      const title = titleEl.value.trim();
      const targetAmount = parseFloat(targetEl.value);
      if (!title) {
        if (errorEl) errorEl.textContent = 'Goal Title is required.';
        titleEl.focus();
        return;
      }
      if (isNaN(targetAmount) || targetAmount < 0) {
        if (errorEl) errorEl.textContent = 'Please enter a valid target amount.';
        targetEl.focus();
        return;
      }
      const data = {
        title: title,
        description: document.getElementById('description').value,
        targetAmount: targetAmount,
        currentAmount: 0,
        startDate: document.getElementById('startDate').value || null,
        endDate: document.getElementById('endDate').value || null,
        status: document.getElementById('goalStatus').value || 'Active'
      };
      try {
        if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }
        await apiFetch('/api/goals', { method: 'POST', body: JSON.stringify(data) });
        const modalEl = document.getElementById('addModal');
        const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
        modal.hide();
        document.getElementById('addForm').reset();
        document.getElementById('goalStatus').value = 'Active';
        alert('Goal created successfully.');
        loadGoals();
      } catch (e) {
        if (errorEl) errorEl.textContent = 'Failed to add goal: ' + e.message;
        else alert('Failed to add goal: ' + e.message);
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Save Goal'; }
      }
    }

    loadGoals();
  </script>
</body>
</html>
