<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register - Donation System', false)}"></head>
<body class="app-body">
  <nav th:replace="~{fragments/layout :: navbar('register')}"></nav>

  <main class="container app-main auth-shell">
    <div class="login-container">
      <div class="card auth-card">
        <p class="page-kicker text-center mb-2">Donation System</p>
        <h1 class="text-center mb-2"><i class="bi bi-person-plus me-1"></i>Create account</h1>
        <p class="text-center text-muted mb-4">Sign up to get started.</p>

        <div th:if="${error}" class="alert alert-danger" role="alert">
          <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
        </div>

        <form th:action="@{/register}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input type="text" class="form-control" id="username" name="username"
                   th:value="${username}" autocomplete="username" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input type="email" class="form-control" id="email" name="email"
                   th:value="${email}" autocomplete="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   autocomplete="new-password" minlength="6" required>
            <div class="form-text">Use at least 6 characters.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="confirmPassword">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                   autocomplete="new-password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Create Account</button>
        </form>

        <p class="auth-links mb-0">
          <a href="/login">Back to Login</a>
        </p>
      </div>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
