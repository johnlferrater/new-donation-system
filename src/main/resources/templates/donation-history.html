<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donation History - Donation System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/"><i class="bi bi-heart-fill text-danger"></i> Donation System</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="/goals">Goals</a></li>
          <li class="nav-item"><a class="nav-link" href="/donation-records">Records</a></li>
          <li class="nav-item"><a class="nav-link active" href="/donation-history">History</a></li>
          <li class="nav-item"><a class="nav-link" href="/announcements">Announcements</a></li>
          <li class="nav-item"><a class="nav-link" href="/users">Users</a></li>
          <li class="nav-item"><a class="nav-link" href="/admins">Admins</a></li>
          <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2><i class="bi bi-clock-history"></i> Donation History</h2>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal"><i class="bi bi-plus-lg"></i> Add Entry</button>
    </div>

    <div class="card p-4">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr><th>ID</th><th>Username</th><th>Item</th><th>Amount</th><th>Payment Method</th><th>Date Donated</th></tr>
          </thead>
          <tbody id="historyTableBody">
            <tr><td colspan="6" class="text-center text-muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add Donation History</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="addForm">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Item</label>
              <input type="text" class="form-control" id="item" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Amount (₱)</label>
              <input type="number" class="form-control" id="amount" step="0.01" min="0" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Payment Method</label>
              <select class="form-select" id="paymentMethod" required>
                <option value="">Select method...</option>
                <option value="PayMaya">PayMaya</option>
                <option value="GCash">GCash</option>
                <option value="Personal">Personal</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="addHistory()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    async function loadHistory() {
      try {
        const history = await fetch('/api/donation-history').then(r => r.json());
        const tbody = document.getElementById('historyTableBody');
        if (history.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No history found</td></tr>';
          return;
        }
        tbody.innerHTML = history.map(h => `<tr>
          <td>${h.id}</td>
          <td>${h.username}</td>
          <td>${h.item}</td>
          <td>₱${h.amount.toLocaleString()}</td>
          <td><span class="badge bg-info">${h.paymentMethod}</span></td>
          <td>${h.dateDonated ? new Date(h.dateDonated).toLocaleDateString() : '-'}</td>
        </tr>`).join('');
      } catch (e) {
        console.error('Failed to load history:', e);
      }
    }

    async function addHistory() {
      const data = {
        username: document.getElementById('username').value,
        item: document.getElementById('item').value,
        amount: parseFloat(document.getElementById('amount').value),
        paymentMethod: document.getElementById('paymentMethod').value,
        dateDonated: new Date().toISOString()
      };
      try {
        const res = await fetch('/api/donation-history', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (!res.ok) {
          const err = await res.text();
          alert('Failed to add history: ' + err);
          return;
        }
        bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
        document.getElementById('addForm').reset();
        loadHistory();
      } catch (e) {
        alert('Failed to add history: ' + e.message);
      }
    }

    loadHistory();
  </script>
</body>
</html>
