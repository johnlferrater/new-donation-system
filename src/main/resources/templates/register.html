<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Register - Donation System</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet"
        />
        <link href="/css/styles.css" rel="stylesheet" />
    </head>
    <body class="app-body">
        <nav class="navbar navbar-expand-lg navbar-dark navbar-app sticky-top">
            <div class="container">
                <a class="navbar-brand" href="/">
                    <span class="brand-mark"><i class="bi bi-heart-fill"></i></span>
                    <span>Donation System</span>
                </a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto align-items-lg-center">
                        <li class="nav-item">
                            <a class="nav-link" href="/">
                                <i class="bi bi-house-door me-1"></i>
                                Home
                            </a>
                        </li>
                    </ul>
                    <ul class="navbar-nav align-items-lg-center">
                        <li class="nav-item">
                            <a class="nav-link" href="/login">
                                <i class="bi bi-box-arrow-in-right me-1"></i>
                                Login
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <main class="container app-main auth-shell">
            <div class="login-container">
                <div class="card auth-card">
                    <div class="text-center mb-4">
                        <div
                            class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
                            style="
                                width: 64px;
                                height: 64px;
                                background: linear-gradient(135deg, var(--theme-soft) 0%, var(--theme-accent) 100%);
                            "
                        >
                            <i class="bi bi-person-plus-fill fs-3" style="color: var(--theme-primary)"></i>
                        </div>
                        <p class="page-kicker mb-1">Donation Management System</p>
                        <h1 class="mb-2">
                            <i class="bi bi-person-plus me-2"></i>
                            Create Account
                        </h1>
                        <p class="text-muted mb-0">Sign up to get started</p>
                    </div>

                    <div id="registerError">
                        <div th:if="${error}" class="alert alert-danger border-0" role="alert" th:text="${error}"></div>
                    </div>

                    <form action="/register" method="post" id="registerForm">
                        <input
                            type="hidden"
                            th:if="${_csrf != null}"
                            th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}"
                        />
                        <div class="mb-3">
                            <label class="form-label" for="username">Username</label>
                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                name="username"
                                th:value="${username}"
                                autocomplete="username"
                                placeholder="Choose a username"
                                autofocus
                                required
                            />
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="email">Email Address</label>
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                th:value="${email}"
                                autocomplete="email"
                                placeholder="you@example.com"
                                required
                            />
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="role">Role</label>
                            <select class="form-select" id="role" name="role">
                                <option value="USER" th:selected="${selectedRole != 'ADMIN'}">User</option>
                                <option
                                    value="ADMIN"
                                    th:if="${adminSignupEnabled}"
                                    th:selected="${selectedRole == 'ADMIN'}"
                                >
                                    Admin
                                </option>
                            </select>
                            <div class="form-text" th:unless="${adminSignupEnabled}">
                                Administrator sign-up is disabled.
                            </div>
                        </div>
                        <div class="mb-3 d-none" id="adminCodeGroup">
                            <label class="form-label" for="adminCode">Admin code</label>
                            <input
                                type="password"
                                class="form-control"
                                id="adminCode"
                                name="adminCode"
                                autocomplete="off"
                                placeholder="Enter admin sign-up code"
                            />
                            <div class="form-text">Required to create an administrator account.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Password</label>
                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                autocomplete="new-password"
                                minlength="6"
                                placeholder="Enter password"
                                required
                            />
                            <div class="form-text">Use at least 6 characters</div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="confirmPassword">Confirm Password</label>
                            <input
                                type="password"
                                class="form-control"
                                id="confirmPassword"
                                name="confirmPassword"
                                autocomplete="new-password"
                                placeholder="Confirm your password"
                                required
                            />
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2.5">
                            <i class="bi bi-person-check me-2"></i>
                            Create Account
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3" style="border-top: 1px solid var(--theme-border)">
                        <a href="/login" class="fw-semibold text-decoration-none" style="color: var(--theme-primary)">
                            <i class="bi bi-arrow-left me-1"></i>
                            Back to Login
                        </a>
                    </div>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <div class="container">
                <div class="app-footer__inner">
                    <a class="app-footer__brand" href="/">
                        <i class="bi bi-heart-fill"></i>
                        Donation System
                    </a>
                    <p class="mb-0">&copy; 2026 Donation System. All rights reserved.</p>
                </div>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            var roleSelect = document.getElementById('role');
            var adminCodeGroup = document.getElementById('adminCodeGroup');
            var adminCodeInput = document.getElementById('adminCode');

            function toggleAdminCode() {
                var isAdmin = roleSelect.value === 'ADMIN';
                adminCodeGroup.classList.toggle('d-none', !isAdmin);
                adminCodeInput.required = isAdmin;
                if (!isAdmin) {
                    adminCodeInput.value = '';
                }
            }

            roleSelect.addEventListener('change', toggleAdminCode);
            toggleAdminCode();

            document.getElementById('registerForm').addEventListener('submit', function (e) {
                var pw = document.getElementById('password').value;
                var cpw = document.getElementById('confirmPassword').value;
                if (pw !== cpw) {
                    e.preventDefault();
                    document.getElementById('registerError').innerHTML =
                        '<div class="alert alert-danger border-0" role="alert" style="background:#fef2f2;color:#991b1b;"><i class="bi bi-exclamation-triangle me-1"></i> Passwords do not match.</div>';
                }
            });
        </script>
    </body>
</html>
