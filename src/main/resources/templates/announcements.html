<!doctype html>
<html lang="en">
    <head th:replace="~{fragments/layout :: head('Announcements - Donation System', true)}"></head>
    <body class="app-body">
        <nav th:replace="~{fragments/layout :: navbar('announcements')}"></nav>

        <main class="container app-main">
            <header class="page-header mb-4">
                <div class="page-header__copy">
                    <p class="page-kicker">Community</p>
                    <h1 class="page-title">
                        <i class="bi bi-megaphone me-2"></i>
                        Announcements
                    </h1>
                    <p class="page-subtitle">
                        Stay up to date with the latest news, updates, and campaign information.
                    </p>
                </div>
                <div class="page-actions">
                    <button
                        class="btn btn-primary"
                        id="createAnnouncementBtn"
                        data-bs-toggle="modal"
                        data-bs-target="#addModal"
                        onclick="prepareAnnouncementCreate()"
                    >
                        <i class="bi bi-plus-lg"></i>
                        Create Announcement
                    </button>
                </div>
            </header>

            <div id="announcementsFeedback" class="alert d-none" role="status" aria-live="polite"></div>

            <div id="announcementsContainer">
                <div class="card border-0 shadow-sm text-center text-muted py-5">
                    <div class="card-body">
                        <div class="spinner-border text-primary mb-3" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mb-0">Loading announcements...</p>
                    </div>
                </div>
            </div>
        </main>

        <div
            class="modal fade modal-themed"
            id="addModal"
            tabindex="-1"
            aria-labelledby="addAnnouncementTitle"
            aria-hidden="true"
        >
            <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 class="modal-title" id="addAnnouncementTitle">
                            <i class="bi bi-megaphone"></i>
                            Create Announcement
                        </h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="addForm" novalidate>
                            <div class="mb-3">
                                <label class="form-label" for="title">
                                    Announcement Title
                                    <span class="required-mark">*</span>
                                </label>
                                <input type="text" class="form-control" id="title" maxlength="200" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="announcementContent">
                                    Announcement Content
                                    <span class="required-mark">*</span>
                                </label>
                                <textarea class="form-control" id="announcementContent" rows="5" required></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label" for="category">
                                        Category
                                        <span class="required-mark">*</span>
                                    </label>
                                    <select class="form-select" id="category" required>
                                        <option value="" selected disabled hidden>Select a category</option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label" for="publicationDate">Publication Date</label>
                                    <input type="date" class="form-control" id="publicationDate" />
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label" for="expirationDate">Expiration Date</label>
                                    <input type="date" class="form-control" id="expirationDate" />
                                </div>
                            </div>
                            <div class="mb-0">
                                <label class="form-label" for="announcementStatus">Announcement Status</label>
                                <select class="form-select" id="announcementStatus">
                                    <option value="Published" selected>Published</option>
                                    <option value="Draft">Draft</option>
                                </select>
                            </div>
                            <div class="modal-error" style="display: none" role="alert"></div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" form="addForm" id="announcementActionBtn" class="btn btn-primary">
                            <i class="bi bi-send"></i>
                            Publish Announcement
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div
            class="modal fade modal-themed"
            id="editModal"
            tabindex="-1"
            aria-labelledby="editAnnouncementTitle"
            aria-hidden="true"
        >
            <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 class="modal-title" id="editAnnouncementTitle">
                            <i class="bi bi-megaphone"></i>
                            Edit Announcement
                        </h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="editForm" novalidate>
                            <input type="hidden" id="editId" />
                            <div class="mb-3">
                                <label class="form-label" for="editTitle">
                                    Title
                                    <span class="required-mark">*</span>
                                </label>
                                <input type="text" class="form-control" id="editTitle" maxlength="200" required />
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="editCategory">
                                        Category
                                        <span class="required-mark">*</span>
                                    </label>
                                    <select class="form-select" id="editCategory" required>
                                        <option value="" selected disabled hidden>Select a category</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="editPublished">Status</label>
                                    <select class="form-select" id="editPublished">
                                        <option value="true">Published</option>
                                        <option value="false">Draft</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-0">
                                <label class="form-label" for="editMessage">
                                    Message
                                    <span class="required-mark">*</span>
                                </label>
                                <textarea class="form-control" id="editMessage" rows="5" required></textarea>
                            </div>
                            <div class="modal-error" style="display: none" role="alert"></div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" form="editForm" class="btn btn-primary" id="editSubmitBtn">
                            <i class="bi bi-check2"></i>
                            Update Announcement
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <footer class="app-footer">
            <div class="container">
                <div class="app-footer__inner">
                    <a class="app-footer__brand" href="/">
                        <i class="bi bi-heart-fill"></i>
                        Donation System
                    </a>
                    <p class="mb-0">&copy; 2026 Donation System. All rights reserved.</p>
                </div>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/js/app.js"></script>
        <script>
            let isAdmin = false;
            const userReady = loadNavAvatar().then(function (user) {
                if (!user) return;
                isAdmin = user.role === 'ADMIN';
            });
        </script>
        <script>
            let announcementsCache = [];
            let announcementCategories = [];

            async function loadAnnouncementCategories() {
                await userReady;
                if (!isAdmin) return;
                try {
                    announcementCategories = await apiFetch('/api/announcements/categories');
                    fillSelect(document.getElementById('category'), announcementCategories, 'Select a category');
                    fillSelect(document.getElementById('editCategory'), announcementCategories, 'Select a category');
                } catch (e) {
                    console.error('Failed to load announcement categories:', e);
                }
            }

            function prepareAnnouncementCreate() {
                const form = document.getElementById('addForm');
                resetForm(form);
                document.getElementById('announcementStatus').value = 'Published';
                updateAnnouncementActionButton();
                if (announcementCategories.length === 0) loadAnnouncementCategories();
            }

            async function loadAnnouncements() {
                try {
                    await userReady;
                    const createBtn = document.getElementById('createAnnouncementBtn');
                    if (createBtn) createBtn.style.display = isAdmin ? '' : 'none';

                    const announcements = await apiFetch('/api/announcements');
                    announcementsCache = announcements || [];
                    const container = document.getElementById('announcementsContainer');
                    if (announcementsCache.length === 0) {
                        container.innerHTML =
                            '<div class="card surface-card text-center text-muted">No announcements available.</div>';
                        return;
                    }

                    if (isAdmin) {
                        container.innerHTML = `
            <div class="card table-card">
              <div class="table-toolbar">
                <div>
                  <h2 class="section-title">All announcements</h2>
                  <p class="section-subtitle">${announcementsCache.length} announcement${announcementsCache.length === 1 ? '' : 's'}</p>
                </div>
              </div>
              <div class="table-responsive">
                <table class="table table-hover">
                  <thead>
                    <tr>
                      <th>Title</th>
                      <th>Category</th>
                      <th>Status</th>
                      <th>Created/Updated</th>
                      <th class="text-end">Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${announcementsCache
                        .map(
                            (a) => `
                      <tr>
                        <td>
                          <div class="fw-semibold">${escapeHtml(a.title || '(no title)')}</div>
                          <div class="text-muted small">${escapeHtml((a.message || '').substring(0, 80))}${(a.message || '').length > 80 ? '...' : ''}</div>
                        </td>
                        <td>${escapeHtml(a.category || '-')}</td>
                        <td>${a.published ? '<span class="badge bg-success">Published</span>' : '<span class="badge bg-secondary">Draft</span>'}</td>
                        <td class="small text-muted">${escapeHtml(a.updatedAt ? new Date(a.updatedAt).toLocaleString() : a.datePosted ? new Date(a.datePosted).toLocaleString() : '-')}</td>
                        <td>
                          <div class="table-actions">
                            <button class="btn btn-sm btn-outline-primary" onclick="openEditById(${a.id})" aria-label="Edit announcement"><i class="bi bi-pencil"></i> Edit</button>
                            ${a.published ? `<button class="btn btn-sm btn-outline-warning" onclick="unpublishAnnouncement(${a.id})"><i class="bi bi-eye-slash"></i> Unpublish</button>` : `<button class="btn btn-sm btn-outline-success" onclick="publishAnnouncement(${a.id})"><i class="bi bi-eye"></i> Publish</button>`}
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteAnnouncement(${a.id})"><i class="bi bi-trash"></i> Delete</button>
                          </div>
                        </td>
                      </tr>
                    `
                        )
                        .join('')}
                  </tbody>
                </table>
              </div>
            </div>
          `;
                    } else {
                        container.innerHTML = `<div class="card-grid announcement-grid">
            ${announcementsCache
                .map(
                    (a) => `
              <article class="card announcement-card">
                <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
                  <h2 class="announcement-title">${escapeHtml(a.title || 'Announcement')}</h2>
                  ${a.category ? `<span class="badge bg-light">${escapeHtml(a.category)}</span>` : ''}
                </div>
                <p class="announcement-message">${escapeHtml(a.message || '')}</p>
                <span class="announcement-meta"><i class="bi bi-calendar"></i> ${escapeHtml(a.publishedAt ? new Date(a.publishedAt).toLocaleString() : a.datePosted ? new Date(a.datePosted).toLocaleString() : '-')}</span>
              </article>
            `
                )
                .join('')}
          </div>`;
                    }
                } catch (e) {
                    console.error('Failed to load announcements:', e);
                    document.getElementById('announcementsContainer').innerHTML =
                        '<div class="alert alert-danger">Failed to load announcements.</div>';
                }
            }

            function updateAnnouncementActionButton() {
                const statusSelect = document.getElementById('announcementStatus');
                const actionBtn = document.getElementById('announcementActionBtn');
                if (!statusSelect || !actionBtn) return;
                if (statusSelect.value === 'Draft') {
                    actionBtn.innerHTML = '<i class="bi bi-save"></i> Save as Draft';
                    actionBtn.classList.remove('btn-primary');
                    actionBtn.classList.add('btn-outline-primary');
                } else {
                    actionBtn.innerHTML = '<i class="bi bi-send"></i> Publish Announcement';
                    actionBtn.classList.remove('btn-outline-primary');
                    actionBtn.classList.add('btn-primary');
                }
            }

            function addAnnouncementFromDropdown(event) {
                if (event) event.preventDefault();
                const statusSelect = document.getElementById('announcementStatus');
                const status = statusSelect ? statusSelect.value : 'Published';
                addAnnouncement(status);
            }

            async function addAnnouncement(actionStatus) {
                const form = document.getElementById('addForm');
                const titleEl = document.getElementById('title');
                const contentEl = document.getElementById('announcementContent');
                const categoryEl = document.getElementById('category');
                const actionBtn = document.getElementById('announcementActionBtn');

                clearFormValidation(form);
                clearModalError(form);

                const title = titleEl.value.trim();
                const content = contentEl.value.trim();
                const category = categoryEl.value;
                let invalid = false;

                if (!title) {
                    markInvalid(titleEl, 'Announcement title is required.');
                    invalid = true;
                }
                if (!content) {
                    markInvalid(contentEl, 'Announcement content is required.');
                    invalid = true;
                }
                if (!category) {
                    markInvalid(categoryEl, 'Please select a category.');
                    invalid = true;
                }
                if (invalid) {
                    setModalError(form, 'Please fix the highlighted fields.');
                    return;
                }

                const status =
                    actionStatus ||
                    (document.getElementById('announcementStatus')
                        ? document.getElementById('announcementStatus').value
                        : 'Published') ||
                    'Published';
                const data = {
                    title: title,
                    message: content,
                    announcementContent: content,
                    category: category,
                    publicationDate: document.getElementById('publicationDate').value || null,
                    expirationDate: document.getElementById('expirationDate').value || null,
                    status: status,
                    published: status === 'Published',
                };
                setButtonLoading(actionBtn, true, status === 'Draft' ? 'Saving...' : 'Publishing...');
                try {
                    await apiFetch('/api/announcements', { method: 'POST', body: JSON.stringify(data) });
                    closeModal(document.getElementById('addModal'));
                    resetForm(form);
                    document.getElementById('announcementStatus').value = 'Published';
                    showPageFeedback(
                        'announcementsFeedback',
                        status === 'Published' ? 'Announcement published successfully.' : 'Announcement saved as draft.'
                    );
                    await loadAnnouncements();
                } catch (e) {
                    setModalError(form, 'Failed to add announcement: ' + e.message);
                } finally {
                    setButtonLoading(actionBtn, false);
                    updateAnnouncementActionButton();
                }
            }

            function openEditById(id) {
                const announcement = announcementsCache.find(function (item) {
                    return String(item.id) === String(id);
                });
                if (!announcement) return;

                const form = document.getElementById('editForm');
                resetForm(form);
                document.getElementById('editId').value = announcement.id;
                document.getElementById('editTitle').value = announcement.title || '';
                ensureSelectOption(document.getElementById('editCategory'), announcement.category);
                document.getElementById('editCategory').value = announcement.category || '';
                document.getElementById('editMessage').value =
                    announcement.message || announcement.announcementContent || '';
                document.getElementById('editPublished').value = announcement.published ? 'true' : 'false';
                openModal(document.getElementById('editModal'));
            }

            async function updateAnnouncement(event) {
                if (event) event.preventDefault();
                const form = document.getElementById('editForm');
                const id = document.getElementById('editId').value;
                const titleEl = document.getElementById('editTitle');
                const messageEl = document.getElementById('editMessage');
                const categoryEl = document.getElementById('editCategory');
                const submitBtn = document.getElementById('editSubmitBtn');

                clearFormValidation(form);
                clearModalError(form);

                const title = titleEl.value.trim();
                const message = messageEl.value.trim();
                const category = categoryEl.value;
                let invalid = false;

                if (!title) {
                    markInvalid(titleEl, 'Title is required.');
                    invalid = true;
                }
                if (!message) {
                    markInvalid(messageEl, 'Message is required.');
                    invalid = true;
                }
                if (!category) {
                    markInvalid(categoryEl, 'Please select a category.');
                    invalid = true;
                }
                if (invalid) {
                    setModalError(form, 'Please fix the highlighted fields.');
                    return;
                }

                const published = document.getElementById('editPublished').value === 'true';
                const data = {
                    title: title,
                    message: message,
                    announcementContent: message,
                    category: category,
                    status: published ? 'Published' : 'Draft',
                    published: published,
                };
                setButtonLoading(submitBtn, true, 'Updating...');
                try {
                    await apiFetch('/api/announcements/' + id, { method: 'PUT', body: JSON.stringify(data) });
                    closeModal(document.getElementById('editModal'));
                    resetForm(form);
                    showPageFeedback('announcementsFeedback', 'Announcement updated successfully.');
                    await loadAnnouncements();
                } catch (e) {
                    setModalError(form, 'Failed to update announcement: ' + e.message);
                } finally {
                    setButtonLoading(submitBtn, false);
                }
            }

            async function publishAnnouncement(id) {
                if (!confirm('Publish this announcement?')) return;
                try {
                    await apiFetch('/api/announcements/' + id + '/publish', { method: 'POST' });
                    showPageFeedback('announcementsFeedback', 'Announcement published successfully.');
                    loadAnnouncements();
                } catch (e) {
                    showPageFeedback('announcementsFeedback', 'Failed to publish announcement: ' + e.message, 'danger');
                }
            }

            async function unpublishAnnouncement(id) {
                if (!confirm('Unpublish this announcement? It will no longer be visible to users.')) return;
                try {
                    await apiFetch('/api/announcements/' + id + '/unpublish', { method: 'POST' });
                    showPageFeedback('announcementsFeedback', 'Announcement unpublished.');
                    loadAnnouncements();
                } catch (e) {
                    showPageFeedback(
                        'announcementsFeedback',
                        'Failed to unpublish announcement: ' + e.message,
                        'danger'
                    );
                }
            }

            async function deleteAnnouncement(id) {
                if (!confirm('Are you sure you want to delete this announcement? This action cannot be undone.'))
                    return;
                try {
                    await apiFetch('/api/announcements/' + id, { method: 'DELETE' });
                    showPageFeedback('announcementsFeedback', 'Announcement deleted.');
                    loadAnnouncements();
                } catch (e) {
                    showPageFeedback('announcementsFeedback', 'Failed to delete announcement: ' + e.message, 'danger');
                }
            }

            const announcementStatusSelect = document.getElementById('announcementStatus');
            if (announcementStatusSelect) {
                announcementStatusSelect.addEventListener('change', updateAnnouncementActionButton);
            }
            document.getElementById('addForm').addEventListener('submit', addAnnouncementFromDropdown);
            document.getElementById('editForm').addEventListener('submit', updateAnnouncement);
            updateAnnouncementActionButton();
            loadAnnouncementCategories();
            loadAnnouncements();
        </script>
    </body>
</html>
