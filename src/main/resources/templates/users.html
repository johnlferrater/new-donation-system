<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users - Donation System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/"><i class="bi bi-heart-fill text-danger"></i> Donation System</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="/goals">Goals</a></li>
          <li class="nav-item"><a class="nav-link" href="/donation-records">Records</a></li>
          <li class="nav-item"><a class="nav-link" href="/donation-history">History</a></li>
          <li class="nav-item"><a class="nav-link" href="/announcements">Announcements</a></li>
          <li class="nav-item"><a class="nav-link active" href="/users">Users</a></li>
          <li class="nav-item"><a class="nav-link" href="/admins">Admins</a></li>
          <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2><i class="bi bi-people"></i> Users</h2>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal"><i class="bi bi-plus-lg"></i> Add User</button>
    </div>

    <div class="card p-4">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr><th>Username</th><th>Email</th><th>Date Created</th></tr>
          </thead>
          <tbody id="usersTableBody">
            <tr><td colspan="3" class="text-center text-muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add New User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="addForm">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" id="password" required>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="addUser()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    async function loadUsers() {
      try {
        const users = await fetch('/api/users').then(r => r.json());
        const tbody = document.getElementById('usersTableBody');
        if (users.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">No users found</td></tr>';
          return;
        }
        tbody.innerHTML = users.map(u => `<tr>
          <td>${u.username}</td>
          <td>${u.email}</td>
          <td>${u.dateCreated ? new Date(u.dateCreated).toLocaleDateString() : '-'}</td>
        </tr>`).join('');
      } catch (e) {
        console.error('Failed to load users:', e);
      }
    }

    async function addUser() {
      const data = {
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };
      try {
        const res = await fetch('/api/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (!res.ok) {
          const err = await res.text();
          alert('Failed to add user: ' + err);
          return;
        }
        bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
        document.getElementById('addForm').reset();
        loadUsers();
      } catch (e) {
        alert('Failed to add user: ' + e.message);
      }
    }

    loadUsers();
  </script>
</body>
</html>
