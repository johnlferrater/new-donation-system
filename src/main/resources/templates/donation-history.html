<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Donation History - Donation System', true)}"></head>
<body class="app-body">
  <nav th:replace="~{fragments/layout :: navbar('history')}"></nav>

  <main class="container app-main">
    <header class="page-header">
      <div class="page-header__copy">
        <p class="page-kicker">Timeline</p>
        <h1 class="page-title"><i class="bi bi-clock-history me-2"></i>Donation History</h1>
        <p class="page-subtitle">Review the full timeline of donations and contributions.</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal">
          <i class="bi bi-plus-lg"></i> Add Entry
        </button>
      </div>
    </header>

    <section class="card table-card" aria-labelledby="historyTableHeading">
      <div class="table-toolbar">
        <div>
          <h2 class="section-title" id="historyTableHeading">All entries</h2>
          <p class="section-subtitle">Every recorded donation transaction</p>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr><th>ID</th><th>Username</th><th>Item</th><th>Amount</th><th>Payment Method</th><th>Date Donated</th></tr>
          </thead>
          <tbody id="historyTableBody">
            <tr><td colspan="6" class="text-center text-muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addHistoryTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="addHistoryTitle">Add Donation History</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="addForm">
            <div class="mb-3">
              <label class="form-label" for="username">Username</label>
              <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="item">Item</label>
              <input type="text" class="form-control" id="item" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="amount">Amount (₱)</label>
              <input type="number" class="form-control" id="amount" step="0.01" min="0" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="paymentMethod">Payment Method</label>
              <select class="form-select" id="paymentMethod" required>
                <option value="">Select method...</option>
                <option value="PayMaya">PayMaya</option>
                <option value="GCash">GCash</option>
                <option value="Personal">Personal</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="addHistory()">Save Entry</button>
        </div>
      </div>
    </div>
  </div>

  <footer th:replace="~{fragments/layout :: footer}"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function loadHistory() {
      try {
        const history = await apiFetch('/api/donation-history');
        const tbody = document.getElementById('historyTableBody');
        if (history.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No history found</td></tr>';
          return;
        }
        tbody.innerHTML = history.map(h => `<tr>
          <td>${Number(h.id)}</td>
          <td class="fw-semibold">${escapeHtml(h.username)}</td>
          <td>${escapeHtml(h.item)}</td>
          <td class="fw-semibold">₱${Number(h.amount).toLocaleString()}</td>
          <td><span class="badge bg-primary">${escapeHtml(h.paymentMethod)}</span></td>
          <td>${h.dateDonated ? new Date(h.dateDonated).toLocaleDateString() : '-'}</td>
        </tr>`).join('');
      } catch (e) {
        console.error('Failed to load history:', e);
        document.getElementById('historyTableBody').innerHTML = '<tr><td colspan="6" class="text-center text-danger">Failed to load history.</td></tr>';
      }
    }

    async function addHistory() {
      const data = {
        username: document.getElementById('username').value,
        item: document.getElementById('item').value,
        amount: parseFloat(document.getElementById('amount').value),
        paymentMethod: document.getElementById('paymentMethod').value
      };
      try {
        await apiFetch('/api/donation-history', { method: 'POST', body: JSON.stringify(data) });
        bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
        document.getElementById('addForm').reset();
        loadHistory();
      } catch (e) {
        alert('Failed to add history: ' + e.message);
      }
    }

    loadHistory();
  </script>
</body>
</html>
