<!doctype html>
<html lang="en">
    <head th:replace="~{fragments/layout :: head('Donation History - Donation System', true)}"></head>
    <body class="app-body">
        <nav th:replace="~{fragments/layout :: navbar('history')}"></nav>

        <main class="container app-main">
            <header class="page-header mb-4">
                <div class="page-header__copy">
                    <p class="page-kicker">Timeline</p>
                    <h1 class="page-title">
                        <i class="bi bi-clock-history me-2"></i>
                        Donation History
                    </h1>
                    <p class="page-subtitle">Review the full timeline of donations and contributions.</p>
                </div>
                <div class="page-actions">
                    <button
                        class="btn btn-primary"
                        data-bs-toggle="modal"
                        data-bs-target="#historyModal"
                        onclick="prepareHistoryCreate()"
                    >
                        <i class="bi bi-plus-lg"></i>
                        Add Entry
                    </button>
                </div>
            </header>

            <div id="historyFeedback" class="alert d-none" role="status" aria-live="polite"></div>

            <section class="card border-0 shadow-sm" aria-labelledby="historyTableHeading">
                <div class="card-header bg-white border-bottom py-3">
                    <div>
                        <h2 class="h5 mb-1" id="historyTableHeading">All Entries</h2>
                        <p class="text-muted small mb-0">Every recorded donation transaction</p>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="border-0">ID</th>
                                    <th class="border-0">Username</th>
                                    <th class="border-0">Item</th>
                                    <th class="border-0">Amount</th>
                                    <th class="border-0">Payment Method</th>
                                    <th class="border-0">Date Donated</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody">
                                <tr><td colspan="6" class="text-center text-muted py-4">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>

        <div
            class="modal fade modal-themed"
            id="historyModal"
            tabindex="-1"
            aria-labelledby="addHistoryTitle"
            aria-hidden="true"
        >
            <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 class="modal-title" id="addHistoryTitle">
                            <i class="bi bi-clock-history"></i>
                            Add Donation History
                        </h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="historyForm" novalidate>
                            <div class="mb-3" id="usernameField">
                                <label class="form-label" for="username">
                                    Username
                                    <span class="required-mark">*</span>
                                </label>
                                <input type="text" class="form-control" id="username" maxlength="100" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="item">
                                    Item
                                    <span class="required-mark">*</span>
                                </label>
                                <input type="text" class="form-control" id="item" maxlength="255" required />
                            </div>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label" for="amount">
                                        Amount (₱)
                                        <span class="required-mark">*</span>
                                    </label>
                                    <input
                                        type="number"
                                        class="form-control"
                                        id="amount"
                                        step="0.01"
                                        min="0"
                                        required
                                    />
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="paymentMethod">
                                        Payment Method
                                        <span class="required-mark">*</span>
                                    </label>
                                    <select class="form-select" id="paymentMethod" required>
                                        <option value="" selected disabled hidden>Select a payment method</option>
                                    </select>
                                </div>
                            </div>
                            <div class="modal-error" style="display: none" role="alert"></div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" form="historyForm" class="btn btn-primary" id="historySubmitBtn">
                            <i class="bi bi-check2"></i>
                            Save Entry
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <footer class="app-footer">
            <div class="container">
                <div class="app-footer__inner">
                    <a class="app-footer__brand" href="/">
                        <i class="bi bi-heart-fill"></i>
                        Donation System
                    </a>
                    <p class="mb-0">&copy; 2026 Donation System. All rights reserved.</p>
                </div>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/js/app.js"></script>
        <script>
            let currentUsername = '';
            let usernameLocked = false;
            const currentUserReady = loadNavAvatar().then(function (user) {
                if (!user) return null;
                if (user.role !== 'ADMIN') {
                    currentUsername = user.username;
                    usernameLocked = true;
                    const usernameInput = document.getElementById('username');
                    if (usernameInput) usernameInput.value = currentUsername;
                    const usernameField = document.getElementById('usernameField');
                    if (usernameField) usernameField.style.display = 'none';
                }
                return user;
            });

            let paymentMethods = [];

            async function loadPaymentMethods() {
                try {
                    paymentMethods = await apiFetch('/api/donation-options/payment-methods');
                    fillSelect(
                        document.getElementById('paymentMethod'),
                        paymentMethods || [],
                        'Select a payment method'
                    );
                } catch (e) {
                    console.error('Failed to load payment methods:', e);
                    showPageFeedback(
                        'historyFeedback',
                        'Failed to load payment methods. Please refresh the page.',
                        'danger'
                    );
                }
            }

            async function prepareHistoryCreate() {
                await currentUserReady;
                if (paymentMethods.length === 0) await loadPaymentMethods();
                const form = document.getElementById('historyForm');
                resetForm(form);
                fillSelect(document.getElementById('paymentMethod'), paymentMethods, 'Select a payment method');
                const usernameField = document.getElementById('usernameField');
                if (usernameLocked) {
                    document.getElementById('username').value = currentUsername;
                    if (usernameField) usernameField.style.display = 'none';
                } else if (usernameField) {
                    usernameField.style.display = '';
                }
            }

            async function loadHistory() {
                try {
                    const history = await apiFetch('/api/donation-history');
                    const tbody = document.getElementById('historyTableBody');
                    if (history.length === 0) {
                        tbody.innerHTML =
                            '<tr><td colspan="6" class="text-center text-muted">No history found</td></tr>';
                        return;
                    }
                    tbody.innerHTML = history
                        .map(
                            (h) => `<tr>
          <td>${Number(h.id)}</td>
          <td class="fw-semibold">${escapeHtml(h.username)}</td>
          <td>${escapeHtml(h.item)}</td>
          <td class="fw-semibold">₱${Number(h.amount).toLocaleString()}</td>
          <td><span class="badge bg-primary">${escapeHtml(h.paymentMethod)}</span></td>
          <td>${h.dateDonated ? new Date(h.dateDonated).toLocaleDateString() : '-'}</td>
        </tr>`
                        )
                        .join('');
                } catch (e) {
                    console.error('Failed to load history:', e);
                    document.getElementById('historyTableBody').innerHTML =
                        '<tr><td colspan="6" class="text-center text-danger">Failed to load history.</td></tr>';
                }
            }

            async function addHistory(event) {
                if (event) event.preventDefault();
                await currentUserReady;
                const form = document.getElementById('historyForm');
                const usernameEl = document.getElementById('username');
                const itemEl = document.getElementById('item');
                const amountEl = document.getElementById('amount');
                const paymentEl = document.getElementById('paymentMethod');
                const submitBtn = document.getElementById('historySubmitBtn');

                if (paymentMethods.length === 0) await loadPaymentMethods();
                clearFormValidation(form);
                clearModalError(form);

                const username = usernameLocked ? currentUsername : usernameEl.value.trim();
                const item = itemEl.value.trim();
                const amount = parseFloat(amountEl.value);
                const paymentMethod = paymentEl.value;
                let invalid = false;

                if (!username) {
                    markInvalid(usernameEl, 'Username is required.');
                    invalid = true;
                }
                if (!item) {
                    markInvalid(itemEl, 'Item is required.');
                    invalid = true;
                }
                if (!amountEl.value || isNaN(amount) || amount < 0) {
                    markInvalid(amountEl, 'Enter a valid amount.');
                    invalid = true;
                }
                if (!paymentMethod) {
                    markInvalid(paymentEl, 'Please select a payment method.');
                    invalid = true;
                }
                if (invalid) {
                    setModalError(form, 'Please fix the highlighted fields.');
                    return;
                }

                const data = {
                    username: username,
                    item: item,
                    amount: amount,
                    paymentMethod: paymentMethod,
                };

                setButtonLoading(submitBtn, true, 'Saving...');
                try {
                    await apiFetch('/api/donation-history', { method: 'POST', body: JSON.stringify(data) });
                    closeModal(document.getElementById('historyModal'));
                    resetForm(form);
                    if (usernameLocked) document.getElementById('username').value = currentUsername;
                    showPageFeedback('historyFeedback', 'Donation history entry added successfully.');
                    await loadHistory();
                } catch (e) {
                    setModalError(form, 'Failed to add history: ' + e.message);
                } finally {
                    setButtonLoading(submitBtn, false);
                }
            }

            document.getElementById('historyForm').addEventListener('submit', addHistory);
            loadPaymentMethods();
            loadHistory();
        </script>
    </body>
</html>
