<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Donation Records - Donation System', true)}"></head>
<body class="app-body">
  <nav th:replace="~{fragments/layout :: navbar('records')}"></nav>

  <main class="container app-main">
    <header class="page-header mb-4">
      <div class="page-header__copy">
        <p class="page-kicker">Donations</p>
        <h1 class="page-title"><i class="bi bi-cash-stack me-2"></i>Donation Records</h1>
        <p class="page-subtitle">Record and review all incoming contributions in one place.</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal">
          <i class="bi bi-plus-lg"></i> Add Record
        </button>
      </div>
    </header>

    <section class="card border-0 shadow-sm" aria-labelledby="recordsTableHeading">
      <div class="card-header bg-white border-bottom py-3">
        <div>
          <h2 class="h5 mb-1" id="recordsTableHeading">All Records</h2>
          <p class="text-muted small mb-0">Donation details and payment information</p>
        </div>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr><th class="border-0">ID</th><th class="border-0">Donor Name</th><th class="border-0">Address</th><th class="border-0">Type</th><th class="border-0">Amount</th><th class="border-0">Payment</th><th class="border-0">Date Donated</th></tr>
            </thead>
            <tbody id="recordsTableBody">
              <tr><td colspan="7" class="text-center text-muted py-4">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addRecordTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="addRecordTitle">Add Donation Record</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="addForm">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label" for="donorName">Donor Name</label>
                <input type="text" class="form-control" id="donorName" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label" for="donorAddress">Donor Address</label>
                <input type="text" class="form-control" id="donorAddress" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label" for="donationType">Donation Type</label>
                <select class="form-select" id="donationType" required>
                  <option value="">Select type...</option>
                  <option value="Cash">Cash</option>
                  <option value="Check">Check</option>
                  <option value="Online">Online</option>
                  <option value="In-Kind">In-Kind</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label" for="dateDonated">Date Donated</label>
                <input type="date" class="form-control" id="dateDonated" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label" for="amount">Amount (₱)</label>
                <input type="number" class="form-control" id="amount" step="0.01" min="0" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label" for="paymentMethod">Payment Method</label>
                <select class="form-select" id="paymentMethod" required>
                  <option value="">Select method...</option>
                  <option value="PayMaya">PayMaya</option>
                  <option value="GCash">GCash</option>
                  <option value="Personal">Personal</option>
                </select>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="addRecord()">Save Record</button>
        </div>
      </div>
    </div>
  </div>

  <footer th:replace="~{fragments/layout :: footer}"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function loadRecords() {
      try {
        const records = await apiFetch('/api/donation-records');
        const tbody = document.getElementById('recordsTableBody');
        if (records.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No records found</td></tr>';
          return;
        }
        tbody.innerHTML = records.map(r => `<tr>
          <td>${Number(r.recordId)}</td>
          <td class="fw-semibold">${escapeHtml(r.donorName)}</td>
          <td>${escapeHtml(r.donorAddress)}</td>
          <td><span class="badge bg-light">${escapeHtml(r.donationType)}</span></td>
          <td class="fw-semibold">₱${Number(r.amount).toLocaleString()}</td>
          <td><span class="badge bg-primary">${escapeHtml(r.paymentMethod)}</span></td>
          <td>${r.dateDonated ? new Date(r.dateDonated).toLocaleDateString() : '-'}</td>
        </tr>`).join('');
      } catch (e) {
        console.error('Failed to load records:', e);
        document.getElementById('recordsTableBody').innerHTML = '<tr><td colspan="7" class="text-center text-danger">Failed to load records.</td></tr>';
      }
    }

    async function addRecord() {
      const donorName = document.getElementById('donorName').value.trim();
      const donorAddress = document.getElementById('donorAddress').value.trim();
      const donationType = document.getElementById('donationType').value;
      const dateDonated = document.getElementById('dateDonated').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const paymentMethod = document.getElementById('paymentMethod').value;
      if (!donorName || !donorAddress || !donationType || !dateDonated || isNaN(amount) || amount < 0 || !paymentMethod) {
        alert('Please fill in all required fields with valid values.');
        return;
      }
      const data = {
        donorName: donorName,
        donorAddress: donorAddress,
        donationType: donationType,
        dateDonated: dateDonated,
        amount: amount,
        paymentMethod: paymentMethod
      };
      try {
        await apiFetch('/api/donation-records', { method: 'POST', body: JSON.stringify(data) });
        const modalEl = document.getElementById('addModal');
        const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
        modal.hide();
        document.getElementById('addForm').reset();
        alert('Donation record submitted successfully.');
        loadRecords();
      } catch (e) {
        alert('Failed to add record: ' + e.message);
      }
    }

    loadRecords();
  </script>
</body>
</html>
