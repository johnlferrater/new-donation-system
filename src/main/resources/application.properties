# ---------------------------------------------------------------------------
# Database connection
#
# This tracked file contains no secrets. The local password is read from the
# DB_PASSWORD environment variable. There is deliberately no local properties
# import, so no secondary file can silently override these values.
# ---------------------------------------------------------------------------
# Railway injects PORT; local default is 8080.
server.port=${PORT:8080}
# Trust X-Forwarded-* headers from Railway/Netlify proxies.
server.forward-headers-strategy=FRAMEWORK

# MySQL settings come from environment variables; no credentials are hardcoded.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/donation_system?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:donation_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate detects the MySQL dialect from JDBC metadata; do not hardcode it.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.settings.web-allow-others=false

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

app.bootstrap.admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}

# Leave blank to disable admin self-registration.
app.admin-signup-code=${ADMIN_SIGNUP_CODE:}

# Exact frontend origin(s), comma-separated, e.g. https://your-site.netlify.app
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
app.csrf.cookie.same-site=${CSRF_COOKIE_SAME_SITE:lax}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


app.auth.mode=SESSION
app.tabauth.token-ttl-minutes=30
app.tabauth.cleanup-interval-ms=60000

app.notifications.retention-days=30
app.notifications.cleanup-interval-ms=86400000

