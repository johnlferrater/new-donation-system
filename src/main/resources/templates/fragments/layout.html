<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title, csrf)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title}">Donation System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/styles.css}" rel="stylesheet">
  <meta th:if="${csrf}" name="_csrf" th:content="${_csrf?.token}">
  <meta th:if="${csrf}" name="_csrf_header" th:content="${_csrf?.headerName}">
</head>
<body>
<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg navbar-dark navbar-app sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/">
      <span class="brand-mark"><i class="bi bi-heart-fill"></i></span>
      <span>Donation System</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto align-items-lg-center">
        <li class="nav-item">
          <a class="nav-link" th:classappend="${active == 'home'} ? ' active' : ''" href="/">
            <i class="bi bi-house-door me-1"></i>Home
          </a>
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
          <a class="nav-link" th:classappend="${active == 'dashboard'} ? ' active' : ''" href="/dashboard">
            <i class="bi bi-speedometer2 me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
          <a class="nav-link" th:classappend="${active == 'goals'} ? ' active' : ''" href="/goals">
            <i class="bi bi-bullseye me-1"></i>Goals
          </a>
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
          <a class="nav-link" th:classappend="${active == 'records'} ? ' active' : ''" href="/donation-records">
            <i class="bi bi-cash-stack me-1"></i>Records
          </a>
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
          <a class="nav-link" th:classappend="${active == 'history'} ? ' active' : ''" href="/donation-history">
            <i class="bi bi-clock-history me-1"></i>History
          </a>
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
          <a class="nav-link" th:classappend="${active == 'announcements'} ? ' active' : ''" href="/announcements">
            <i class="bi bi-megaphone me-1"></i>Announcements
          </a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
          <a class="nav-link" th:classappend="${active == 'users'} ? ' active' : ''" href="/users">
            <i class="bi bi-people me-1"></i>Users
          </a>
        </li>
      </ul>
      <ul class="navbar-nav align-items-lg-center">
        <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
          <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle fs-5"></i>
            <span class="nav-account-name" sec:authentication="name">account</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0">
            <li><h6 class="dropdown-header" sec:authentication="name">account</h6></li>
            <li><a class="dropdown-item" href="/profile"><i class="bi bi-person me-2"></i> Profile</a></li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <form th:action="@{/logout}" method="post">
                <button type="submit" class="dropdown-item dropdown-item-danger">
                  <i class="bi bi-box-arrow-right me-2"></i> Logout
                </button>
              </form>
            </li>
          </ul>
        </li>
        <li class="nav-item" sec:authorize="!isAuthenticated()">
          <a class="nav-link" th:classappend="${active == 'login'} ? ' active' : ''" href="/login">
            <i class="bi bi-box-arrow-in-right me-1"></i>Login
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
<footer th:fragment="footer" class="app-footer">
  <div class="container">
    <div class="app-footer__inner">
      <a class="app-footer__brand" href="/"><i class="bi bi-heart-fill"></i> Donation System</a>
      <p class="mb-0">&copy; 2026 Donation System. All rights reserved.</p>
    </div>
  </div>
</footer>
</body>
</html>
