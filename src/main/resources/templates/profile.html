<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('My Profile - Donation System', true)}"></head>
<body class="app-body">
  <nav th:replace="~{fragments/layout :: navbar('profile')}"></nav>
  <main class="container app-main">
    <header class="page-header mb-4">
      <div class="page-header__copy">
        <p class="page-kicker">Account</p>
        <h1 class="page-title"><i class="bi bi-person-circle me-2"></i>My Profile</h1>
        <p class="page-subtitle">View and update your account information.</p>
      </div>
    </header>
    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-header bg-white border-bottom py-3">
            <h2 class="h5 mb-0"><i class="bi bi-info-circle me-2" style="color: var(--theme-primary);"></i>Profile Information</h2>
          </div>
          <div class="card-body">
            <div class="mb-3 pb-3 border-bottom">
              <div class="text-muted small mb-1">Username</div>
              <div class="fw-semibold" id="profileUsername">-</div>
            </div>
            <div class="mb-3 pb-3 border-bottom">
              <div class="text-muted small mb-1">Email</div>
              <div class="fw-semibold" id="profileEmail">-</div>
            </div>
            <div class="mb-3 pb-3 border-bottom">
              <div class="text-muted small mb-1">Full Name</div>
              <div class="fw-semibold" id="profileFullName">-</div>
            </div>
            <div class="mb-0">
              <div class="text-muted small mb-1">Role</div>
              <span class="badge" id="profileRole" style="background: var(--theme-soft); color: var(--theme-primary-dark);">-</span>
            </div>
          </div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-header bg-white border-bottom py-3">
            <h2 class="h5 mb-0"><i class="bi bi-pencil-square me-2" style="color: var(--theme-primary);"></i>Update Profile</h2>
          </div>
          <div class="card-body">
            <div class="d-flex align-items-center gap-3 mb-3">
              <div style="width: 72px; height: 72px; border-radius: 50%; overflow: hidden; background: var(--theme-soft); display:flex; align-items:center; justify-content:center;">
                <img id="profilePictureImg" src="" alt="Profile picture" style="width:100%; height:100%; object-fit:cover; display:none;">
                <i id="profilePicturePlaceholder" class="bi bi-person-circle" style="font-size: 3rem; color: var(--theme-primary);"></i>
              </div>
              <div>
                <div class="fw-semibold">Profile Picture</div>
                <div class="text-muted small">JPG, PNG, or WebP. Max 5 MB.</div>
              </div>
            </div>
            <form id="profilePictureForm" enctype="multipart/form-data" novalidate>
              <div class="mb-3">
                <input class="form-control" type="file" id="profilePictureFile" accept="image/jpeg,image/png,image/webp" onchange="previewProfilePicture(event)">
              </div>
              <button type="button" class="btn btn-outline-primary mb-3" onclick="uploadProfilePicture()">
                <i class="bi bi-upload me-1"></i>Upload Picture
              </button>
            </form>
            <form id="profileForm" novalidate>
              <div class="mb-3">
                <label class="form-label" for="fullName">Full Name</label>
                <input type="text" class="form-control" id="fullName" maxlength="150" placeholder="Enter your full name">
              </div>
              <div class="mb-3">
                <label class="form-label" for="email">Email <span class="text-danger">*</span></label>
                <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
              </div>
              <button type="button" class="btn btn-primary" onclick="updateProfile()">
                <i class="bi bi-check-lg me-1"></i>Save Changes
              </button>
            </form>
          </div>
        </div>
      </div>
      <div class="col-12">
        <div class="card border-0 shadow-sm">
          <div class="card-header bg-white border-bottom py-3">
            <h2 class="h5 mb-0"><i class="bi bi-shield-lock me-2" style="color: var(--theme-primary);"></i>Change Password</h2>
          </div>
          <div class="card-body">
            <form id="passwordForm" novalidate>
              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label" for="currentPassword">Current Password <span class="text-danger">*</span></label>
                  <input type="password" class="form-control" id="currentPassword" placeholder="Enter current password" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="newPassword">New Password <span class="text-danger">*</span></label>
                  <input type="password" class="form-control" id="newPassword" minlength="6" placeholder="Enter new password" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="confirmPassword">Confirm New Password <span class="text-danger">*</span></label>
                  <input type="password" class="form-control" id="confirmPassword" minlength="6" placeholder="Confirm new password" required>
                </div>
              </div>
              <div class="mt-3">
                <button type="button" class="btn btn-primary" onclick="changePassword()">
                  <i class="bi bi-key me-1"></i>Change Password
                </button>
              </div>
              <div class="form-text mt-2">You must enter your current password before changing it.</div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let currentUser = null;
    function updateProfilePictureDisplay(user) {
      const img = document.getElementById('profilePictureImg');
      const placeholder = document.getElementById('profilePicturePlaceholder');
      if (user && user.profilePicture) {
        img.src = '/uploads/' + user.profilePicture + '?t=' + Date.now();
        img.style.display = 'block';
        if (placeholder) placeholder.style.display = 'none';
      } else {
        if (img) { img.src = ''; img.style.display = 'none'; }
        if (placeholder) placeholder.style.display = 'inline-block';
      }
    }
    function previewProfilePicture(event) {
      const file = event.target.files[0];
      const img = document.getElementById('profilePictureImg');
      const placeholder = document.getElementById('profilePicturePlaceholder');
      if (file && img) {
        const reader = new FileReader();
        reader.onload = function(e) {
          img.src = e.target.result;
          img.style.display = 'block';
          if (placeholder) placeholder.style.display = 'none';
        };
        reader.readAsDataURL(file);
      }
    }
    async function uploadProfilePicture() {
      const fileInput = document.getElementById('profilePictureFile');
      const file = fileInput.files[0];
      if (!file) {
        alert('Please select an image file.');
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        alert('File size must be 5MB or less.');
        return;
      }
      const formData = new FormData();
      formData.append('file', file);
      const token = csrfToken();
      const headers = {};
      if (token) headers[csrfHeaderName()] = token;
      try {
        const res = await fetch('/api/users/me/profile-picture', { method: 'POST', headers: headers, body: formData });
        if (!res.ok) {
          let message = res.status + ' ' + res.statusText;
          try { const text = await res.text(); if (text) message = text; } catch(e){}
          throw new Error(message);
        }
        alert('Profile picture updated successfully.');
        fileInput.value = '';
        loadProfile();
      } catch (e) {
        alert('Failed to upload picture: ' + e.message);
      }
    }
    async function loadProfile() {
      try {
        currentUser = await apiFetch('/api/users/me');
        document.getElementById('profileUsername').textContent = currentUser.username || '-';
        document.getElementById('profileEmail').textContent = currentUser.email || '-';
        document.getElementById('profileFullName').textContent = currentUser.fullName || '-';
        document.getElementById('profileRole').textContent = currentUser.role || '-';
        document.getElementById('fullName').value = currentUser.fullName || '';
        document.getElementById('email').value = currentUser.email || '';
        updateProfilePictureDisplay(currentUser);
      } catch (e) {
        alert('Failed to load profile: ' + e.message);
      }
    }
    async function updateProfile() {
      if (!currentUser) return;
      const email = document.getElementById('email').value.trim();
      if (!email) { alert('Email is required.'); return; }
      const data = { email: email, fullName: document.getElementById('fullName').value.trim() || null };
      try {
        await apiFetch('/api/users/' + encodeURIComponent(currentUser.username), { method: 'PUT', body: JSON.stringify(data) });
        alert('Profile updated successfully.');
        loadProfile();
      } catch (e) {
        alert('Failed to update profile: ' + e.message);
      }
    }
    async function changePassword() {
      if (!currentUser) return;
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (!currentPassword || !newPassword || !confirmPassword) { alert('Please fill in all password fields.'); return; }
      if (newPassword !== confirmPassword) { alert('New passwords do not match.'); return; }
      if (currentUser.role === 'ADMIN' && newPassword.length < 12) { alert('Password must be at least 12 characters.'); return; }
      if (currentUser.role !== 'ADMIN' && newPassword.length < 6) { alert('Password must be at least 6 characters.'); return; }
      try {
        await apiFetch('/api/users/me/change-password', { method: 'POST', body: JSON.stringify({ currentPassword: currentPassword, newPassword: newPassword }) });
        alert('Password changed successfully.');
        document.getElementById('passwordForm').reset();
      } catch (e) {
        alert('Failed to change password: ' + e.message);
      }
    }
    loadProfile();
  </script>
</body>
</html>
