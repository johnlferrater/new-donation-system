[build]
  command = "echo 'Static frontend assets are served directly; dynamic pages and APIs are proxied to Railway'"
  publish = "src/main/resources/static"

[[redirects]]
  from = "/api/*"
  to = "https://YOUR-RAILWAY-BACKEND.up.railway.app/api/:splat"
  status = 200

[[redirects]]
  from = "/login"
  to = "https://YOUR-RAILWAY-BACKEND.up.railway.app/login"
  status = 200

[[redirects]]
  from = "/register"
  to = "https://YOUR-RAILWAY-BACKEND.up.railway.app/register"
  status = 200

[[redirects]]
  from = "/logout"
  to = "https://YOUR-RAILWAY-BACKEND.up.railway.app/logout"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "https://YOUR-RAILWAY-BACKEND.up.railway.app/dashboard"
  status = 200

[[redirects]]
  from = "/donation-records"
  to = "https://YOUR-RAILWAY-BACKEND.up.railway.app/donation-records"
  status = 200

[[redirects]]
  from = "/donation-history"
  to = "https://YOUR-RAILWAY-BACKEND.up.railway.app/donation-history"
  status = 200

[[redirects]]
  from = "/goals"
  to = "https://YOUR-RAILWAY-BACKEND.up.railway.app/goals"
  status = 200

[[redirects]]
  from = "/announcements"
  to = "https://YOUR-RAILWAY-BACKEND.up.railway.app/announcements"
  status = 200

[[redirects]]
  from = "/profile"
  to = "https://YOUR-RAILWAY-BACKEND.up.railway.app/profile"
  status = 200

[[redirects]]
  from = "/users"
  to = "https://YOUR-RAILWAY-BACKEND.up.railway.app/users"
  status = 200

[[redirects]]
  from = "/admins"
  to = "https://YOUR-RAILWAY-BACKEND.up.railway.app/admins"
  status = 200

[[redirects]]
  from = "/*"
  to = "https://YOUR-RAILWAY-BACKEND.up.railway.app/:splat"
  status = 200
