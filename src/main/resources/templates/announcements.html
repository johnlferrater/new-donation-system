<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Announcements - Donation System', true)}"></head>
<body class="app-body">
  <nav th:replace="~{fragments/layout :: navbar('announcements')}"></nav>

  <main class="container app-main">
    <header class="page-header">
      <div class="page-header__copy">
        <p class="page-kicker">Community</p>
        <h1 class="page-title"><i class="bi bi-megaphone me-2"></i>Announcements</h1>
        <p class="page-subtitle">Stay up to date with the latest news, updates, and campaign information.</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal"
                sec:authorize="hasRole('ADMIN')"><i class="bi bi-plus-lg"></i> Create Announcement</button>
      </div>
    </header>

    <div id="announcementsContainer">
      <div class="card surface-card text-center text-muted">Loading...</div>
    </div>
  </main>

  <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addAnnouncementTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="addAnnouncementTitle">Create Announcement</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="addForm" novalidate>
            <div class="mb-3">
              <label class="form-label" for="title">Announcement Title <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="title" maxlength="200" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="announcementContent">Announcement Content <span class="text-danger">*</span></label>
              <textarea class="form-control" id="announcementContent" rows="5" required></textarea>
            </div>
            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label" for="category">Category</label>
                <input type="text" class="form-control" id="category" maxlength="100" placeholder="e.g., Updates">
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label" for="publicationDate">Publication Date</label>
                <input type="date" class="form-control" id="publicationDate">
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label" for="expirationDate">Expiration Date</label>
                <input type="date" class="form-control" id="expirationDate">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="announcementStatus">Announcement Status</label>
              <select class="form-select" id="announcementStatus">
                <option value="Published" selected>Published</option>
                <option value="Draft">Draft</option>
              </select>
            </div>
            <div id="announcementFormError" class="text-danger small"></div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-outline-primary" onclick="addAnnouncement('Draft')">Save as Draft</button>
          <button type="button" id="publishAnnouncementBtn" class="btn btn-primary" onclick="addAnnouncement('Published')">Publish Announcement</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editAnnouncementTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="editAnnouncementTitle">Edit Announcement</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="editForm" novalidate>
            <input type="hidden" id="editId">
            <div class="mb-3">
              <label class="form-label" for="editTitle">Title <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="editTitle" maxlength="200" required>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label" for="editCategory">Category</label>
                <input type="text" class="form-control" id="editCategory" maxlength="100">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label" for="editPublished">Status</label>
                <select class="form-select" id="editPublished">
                  <option value="true">Published</option>
                  <option value="false">Draft</option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="editMessage">Message <span class="text-danger">*</span></label>
              <textarea class="form-control" id="editMessage" rows="5" required></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="updateAnnouncement()">Update Announcement</button>
        </div>
      </div>
    </div>
  </div>

  <footer th:replace="~{fragments/layout :: footer}"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script th:inline="javascript">
    const isAdmin = /*[[${#authorization.expression('hasRole(''ADMIN'')')}]]*/ false;
  </script>
  <script>
    let announcementsCache = [];

    async function loadAnnouncements() {
      try {
        const announcements = await apiFetch('/api/announcements');
        announcementsCache = announcements || [];
        const container = document.getElementById('announcementsContainer');
        if (announcementsCache.length === 0) {
          container.innerHTML = '<div class="card surface-card text-center text-muted">No announcements available.</div>';
          return;
        }

        if (isAdmin) {
          container.innerHTML = `
            <div class="card table-card">
              <div class="table-toolbar">
                <div>
                  <h2 class="section-title">All announcements</h2>
                  <p class="section-subtitle">${announcementsCache.length} announcement${announcementsCache.length === 1 ? '' : 's'}</p>
                </div>
              </div>
              <div class="table-responsive">
                <table class="table table-hover">
                  <thead>
                    <tr>
                      <th>Title</th>
                      <th>Category</th>
                      <th>Status</th>
                      <th>Created/Updated</th>
                      <th class="text-end">Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${announcementsCache.map(a => `
                      <tr>
                        <td>
                          <div class="fw-semibold">${escapeHtml(a.title || '(no title)')}</div>
                          <div class="text-muted small">${escapeHtml((a.message || '').substring(0, 80))}${(a.message || '').length > 80 ? '...' : ''}</div>
                        </td>
                        <td>${escapeHtml(a.category || '-')}</td>
                        <td>${a.published ? '<span class="badge bg-success">Published</span>' : '<span class="badge bg-secondary">Draft</span>'}</td>
                        <td class="small text-muted">${escapeHtml(a.updatedAt ? new Date(a.updatedAt).toLocaleString() : (a.datePosted ? new Date(a.datePosted).toLocaleString() : '-'))}</td>
                        <td>
                          <div class="table-actions">
                            <button class="btn btn-sm btn-outline-primary" onclick='openEdit(${JSON.stringify(a).replace(/'/g, "&#39;")})' aria-label="Edit announcement"><i class="bi bi-pencil"></i> Edit</button>
                            ${a.published ? `<button class="btn btn-sm btn-outline-warning" onclick="unpublishAnnouncement(${a.id})"><i class="bi bi-eye-slash"></i> Unpublish</button>` : `<button class="btn btn-sm btn-outline-success" onclick="publishAnnouncement(${a.id})"><i class="bi bi-eye"></i> Publish</button>`}
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteAnnouncement(${a.id})"><i class="bi bi-trash"></i> Delete</button>
                          </div>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        } else {
          container.innerHTML = `<div class="card-grid announcement-grid">
            ${announcementsCache.map(a => `
              <article class="card announcement-card">
                <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
                  <h2 class="announcement-title">${escapeHtml(a.title || 'Announcement')}</h2>
                  ${a.category ? `<span class="badge bg-light">${escapeHtml(a.category)}</span>` : ''}
                </div>
                <p class="announcement-message">${escapeHtml(a.message || '')}</p>
                <span class="announcement-meta"><i class="bi bi-calendar"></i> ${escapeHtml(a.publishedAt ? new Date(a.publishedAt).toLocaleString() : (a.datePosted ? new Date(a.datePosted).toLocaleString() : '-'))}</span>
              </article>
            `).join('')}
          </div>`;
        }
      } catch (e) {
        console.error('Failed to load announcements:', e);
        document.getElementById('announcementsContainer').innerHTML = '<div class="alert alert-danger">Failed to load announcements.</div>';
      }
    }

    async function addAnnouncement(actionStatus) {
      const titleEl = document.getElementById('title');
      const contentEl = document.getElementById('announcementContent');
      const errorEl = document.getElementById('announcementFormError');
      const publishBtn = document.getElementById('publishAnnouncementBtn');
      if (errorEl) errorEl.textContent = '';
      const title = titleEl.value.trim();
      const content = contentEl.value.trim();
      if (!title || !content) {
        if (errorEl) errorEl.textContent = 'Announcement Title and Announcement Content are required.';
        else alert('Announcement Title and Announcement Content are required.');
        return;
      }
      const status = actionStatus || document.getElementById('announcementStatus').value || 'Published';
      const categoryVal = document.getElementById('category').value.trim();
      const data = {
        title: title,
        message: content,
        announcementContent: content,
        category: categoryVal === '' ? null : categoryVal,
        publicationDate: document.getElementById('publicationDate').value || null,
        expirationDate: document.getElementById('expirationDate').value || null,
        status: status,
        published: status === 'Published'
      };
      try {
        if (publishBtn) { publishBtn.disabled = true; publishBtn.textContent = 'Saving...'; }
        await apiFetch('/api/announcements', { method: 'POST', body: JSON.stringify(data) });
        const modalEl = document.getElementById('addModal');
        const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
        modal.hide();
        document.getElementById('addForm').reset();
        document.getElementById('announcementStatus').value = 'Published';
        alert(status === 'Published' ? 'Announcement published successfully.' : 'Announcement saved as draft.');
        loadAnnouncements();
      } catch (e) {
        if (errorEl) errorEl.textContent = 'Failed to add announcement: ' + e.message;
        else alert('Failed to add announcement: ' + e.message);
      } finally {
        if (publishBtn) { publishBtn.disabled = false; publishBtn.textContent = 'Publish Announcement'; }
      }
    }

    function openEdit(a) {
      document.getElementById('editId').value = a.id;
      document.getElementById('editTitle').value = a.title || '';
      document.getElementById('editCategory').value = a.category || '';
      document.getElementById('editMessage').value = a.message || '';
      document.getElementById('editPublished').value = a.published ? 'true' : 'false';
      new bootstrap.Modal(document.getElementById('editModal')).show();
    }

    async function updateAnnouncement() {
      const id = document.getElementById('editId').value;
      const title = document.getElementById('editTitle').value.trim();
      const message = document.getElementById('editMessage').value.trim();
      if (!title || !message) {
        alert('Title and message are required.');
        return;
      }
      const data = {
        title: title,
        message: message,
        category: document.getElementById('editCategory').value.trim() || null,
        published: document.getElementById('editPublished').value === 'true'
      };
      try {
        await apiFetch('/api/announcements/' + id, { method: 'PUT', body: JSON.stringify(data) });
        const modal = bootstrap.Modal.getInstance(document.getElementById('editModal'));
        if (modal) modal.hide();
        loadAnnouncements();
      } catch (e) {
        alert('Failed to update announcement: ' + e.message);
      }
    }

    async function publishAnnouncement(id) {
      if (!confirm('Publish this announcement?')) return;
      try {
        await apiFetch('/api/announcements/' + id + '/publish', { method: 'POST' });
        loadAnnouncements();
      } catch (e) {
        alert('Failed to publish announcement: ' + e.message);
      }
    }

    async function unpublishAnnouncement(id) {
      if (!confirm('Unpublish this announcement? It will no longer be visible to users.')) return;
      try {
        await apiFetch('/api/announcements/' + id + '/unpublish', { method: 'POST' });
        loadAnnouncements();
      } catch (e) {
        alert('Failed to unpublish announcement: ' + e.message);
      }
    }

    async function deleteAnnouncement(id) {
      if (!confirm('Are you sure you want to delete this announcement? This action cannot be undone.')) return;
      try {
        await apiFetch('/api/announcements/' + id, { method: 'DELETE' });
        loadAnnouncements();
      } catch (e) {
        alert('Failed to delete announcement: ' + e.message);
      }
    }

    loadAnnouncements();
  </script>
</body>
</html>
