<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register - Donation System', false)}"></head>
<body class="app-body">
  <nav th:replace="~{fragments/layout :: navbar('register')}"></nav>

  <main class="container app-main auth-shell">
    <div class="login-container">
      <div class="card auth-card">
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 64px; height: 64px; background: linear-gradient(135deg, var(--theme-soft) 0%, var(--theme-accent) 100%);">
            <i class="bi bi-person-plus-fill fs-3" style="color: var(--theme-primary);"></i>
          </div>
          <p class="page-kicker mb-1">Donation Management System</p>
          <h1 class="mb-2"><i class="bi bi-person-plus me-2"></i>Create Account</h1>
          <p class="text-muted mb-0">Sign up to get started</p>
        </div>

        <div th:if="${error}" class="alert alert-danger border-0" role="alert" style="background: #fef2f2; color: #991b1b;">
          <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
        </div>

        <form th:action="@{/register}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input type="text" class="form-control" id="username" name="username"
                   th:value="${username}" autocomplete="username" placeholder="Choose a username" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" class="form-control" id="email" name="email"
                   th:value="${email}" autocomplete="email" placeholder="you@example.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   autocomplete="new-password" minlength="6" placeholder="Enter password" required>
            <div class="form-text">Use at least 6 characters</div>
          </div>
          <div class="mb-4">
            <label class="form-label" for="confirmPassword">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                   autocomplete="new-password" placeholder="Confirm your password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2.5">
            <i class="bi bi-person-check me-2"></i>Create Account
          </button>
        </form>

        <div class="text-center mt-4 pt-3" style="border-top: 1px solid var(--theme-border);">
          <a href="/login" class="fw-semibold text-decoration-none" style="color: var(--theme-primary);">
            <i class="bi bi-arrow-left me-1"></i>Back to Login
          </a>
        </div>
      </div>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
