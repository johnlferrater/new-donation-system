<!doctype html>
<html lang="en">
    <head th:replace="~{fragments/layout :: head('Donation Goals - Donation System', true)}"></head>
    <body class="app-body">
        <nav th:replace="~{fragments/layout :: navbar('goals')}"></nav>

        <main class="container app-main">
            <header class="page-header mb-4">
                <div class="page-header__copy">
                    <p class="page-kicker">Fundraising</p>
                    <h1 class="page-title">
                        <i class="bi bi-bullseye me-2"></i>
                        Donation Goals
                    </h1>
                    <p class="page-subtitle">Set targets and follow the progress of each fundraising campaign.</p>
                </div>
                <div class="page-actions">
                    <button
                        class="btn btn-primary"
                        id="createGoalBtn"
                        data-bs-toggle="modal"
                        data-bs-target="#goalModal"
                        onclick="prepareGoalCreate()"
                    >
                        <i class="bi bi-plus-lg"></i>
                        Create Goal
                    </button>
                </div>
            </header>

            <div id="goalsFeedback" class="alert d-none" role="status" aria-live="polite"></div>

            <div class="row g-4" id="goalsContainer">
                <div class="col-12">
                    <div class="card border-0 shadow-sm text-center text-muted py-5">
                        <div class="card-body">
                            <div class="spinner-border text-primary mb-3" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mb-0">Loading goals...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div
            class="modal fade modal-themed"
            id="goalModal"
            tabindex="-1"
            aria-labelledby="goalModalTitle"
            aria-hidden="true"
        >
            <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 class="modal-title" id="goalModalTitle">
                            <i class="bi bi-bullseye"></i>
                            Create Goal
                        </h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="goalForm" novalidate>
                            <input type="hidden" id="goalId" />
                            <div class="row g-3">
                                <div class="col-md-8">
                                    <label class="form-label" for="goalTitle">
                                        Title
                                        <span class="required-mark">*</span>
                                    </label>
                                    <input type="text" class="form-control" id="goalTitle" maxlength="255" required />
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="goalStatus">Status</label>
                                    <select class="form-select" id="goalStatus">
                                        <option value="Active">Active</option>
                                        <option value="Paused">Paused</option>
                                        <option value="Completed">Completed</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="goalTargetAmount">
                                        Target Amount (₱)
                                        <span class="required-mark">*</span>
                                    </label>
                                    <input
                                        type="number"
                                        class="form-control"
                                        id="goalTargetAmount"
                                        min="0"
                                        step="0.01"
                                        required
                                    />
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="goalCurrentAmount">Current Amount (₱)</label>
                                    <input
                                        type="number"
                                        class="form-control"
                                        id="goalCurrentAmount"
                                        min="0"
                                        step="0.01"
                                        value="0"
                                    />
                                </div>
                                <div class="col-12">
                                    <label class="form-label" for="goalDescription">Description</label>
                                    <textarea
                                        class="form-control"
                                        id="goalDescription"
                                        rows="3"
                                        maxlength="2000"
                                    ></textarea>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="goalStartDate">Start Date</label>
                                    <input type="date" class="form-control" id="goalStartDate" />
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="goalEndDate">End Date</label>
                                    <input type="date" class="form-control" id="goalEndDate" />
                                </div>
                            </div>
                            <div class="modal-error" style="display: none" role="alert"></div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" form="goalForm" class="btn btn-primary" id="goalSubmitBtn">
                            <i class="bi bi-check2"></i>
                            Save Goal
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <footer class="app-footer">
            <div class="container">
                <div class="app-footer__inner">
                    <a class="app-footer__brand" href="/">
                        <i class="bi bi-heart-fill"></i>
                        Donation System
                    </a>
                    <p class="mb-0">&copy; 2026 Donation System. All rights reserved.</p>
                </div>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/js/app.js"></script>
        <script>
            var isAdmin = false;
            var goalsCache = [];
            var userReady = loadNavAvatar().then(function (user) {
                isAdmin = !!user && user.role === 'ADMIN';
                var createBtn = document.getElementById('createGoalBtn');
                if (createBtn && !isAdmin) createBtn.style.display = 'none';
                return user;
            });

            function dateInputValue(value) {
                return value ? String(value).slice(0, 10) : '';
            }

            function prepareGoalCreate() {
                var form = document.getElementById('goalForm');
                resetForm(form);
                document.getElementById('goalId').value = '';
                document.getElementById('goalModalTitle').innerHTML = '<i class="bi bi-bullseye"></i> Create Goal';
                document.getElementById('goalSubmitBtn').innerHTML = '<i class="bi bi-check2"></i> Save Goal';
                document.getElementById('goalStatus').value = 'Active';
            }

            function openGoalEdit(id) {
                var goal = goalsCache.find(function (item) {
                    return String(item.id) === String(id);
                });
                if (!goal) return;

                var form = document.getElementById('goalForm');
                resetForm(form);
                document.getElementById('goalId').value = goal.id;
                document.getElementById('goalTitle').value = goal.title || '';
                document.getElementById('goalDescription').value = goal.description || '';
                document.getElementById('goalTargetAmount').value = goal.targetAmount ?? '';
                document.getElementById('goalCurrentAmount').value = goal.currentAmount ?? 0;
                document.getElementById('goalStartDate').value = dateInputValue(goal.startDate);
                document.getElementById('goalEndDate').value = dateInputValue(goal.endDate);
                ensureSelectOption(document.getElementById('goalStatus'), goal.status || 'Active');
                document.getElementById('goalStatus').value = goal.status || 'Active';
                document.getElementById('goalModalTitle').innerHTML = '<i class="bi bi-bullseye"></i> Edit Goal';
                document.getElementById('goalSubmitBtn').innerHTML = '<i class="bi bi-check2"></i> Update Goal';
                openModal(document.getElementById('goalModal'));
            }

            async function loadGoals() {
                try {
                    await userReady;
                    const goals = await apiFetch('/api/goals');
                    goalsCache = goals;
                    const container = document.getElementById('goalsContainer');
                    if (goals.length === 0) {
                        container.innerHTML =
                            '<div class="col-12"><div class="card border-0 shadow-sm text-center text-muted py-5"><div class="card-body"><i class="bi bi-bullseye fs-1 mb-3 d-block" style="color: var(--theme-border);"></i><h5>No goals yet</h5><p class="mb-0">Create your first donation goal to get started.</p></div></div></div>';
                        return;
                    }
                    container.innerHTML = goals
                        .map((g) => {
                            const target = Number(g.targetAmount) || 0;
                            const current = Number(g.currentAmount) || 0;
                            const pct =
                                target > 0 ? Math.max(0, Math.min(Math.round((current / target) * 100), 100)) : 0;
                            const editAction = isAdmin
                                ? `<div class="d-flex justify-content-end mt-3">
                 <button type="button" class="btn btn-sm btn-outline-primary" onclick="openGoalEdit(${g.id})"><i class="bi bi-pencil"></i> Edit</button>
               </div>`
                                : '';
                            return `<div class="col-md-6 col-lg-4">
            <article class="card border-0 shadow-sm h-100">
              <div class="card-body">
                <div class="d-flex align-items-start justify-content-between mb-3">
                  <h2 class="h5 mb-0">${escapeHtml(g.title)}</h2>
                  <span class="badge bg-primary-soft" style="background: var(--theme-soft); color: var(--theme-primary-dark);">${pct}%</span>
                </div>
                <div class="mb-3">
                  <div class="d-flex justify-content-between align-items-baseline mb-2">
                    <span class="text-muted small">Raised</span>
                    <span class="fw-semibold" style="color: var(--theme-primary);">₱${current.toLocaleString()}</span>
                  </div>
                  <div class="d-flex justify-content-between align-items-baseline mb-2">
                    <span class="text-muted small">Target</span>
                    <span class="fw-semibold">₱${target.toLocaleString()}</span>
                  </div>
                </div>
                <div class="progress" style="height: 10px;" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${pct}% funded">
                  <div class="progress-bar" style="width:${pct}%; background: linear-gradient(90deg, var(--theme-primary) 0%, var(--theme-primary-light) 100%);"></div>
                </div>
                ${editAction}
              </div>
            </article>
          </div>`;
                        })
                        .join('');
                } catch (e) {
                    console.error('Failed to load goals:', e);
                    document.getElementById('goalsContainer').innerHTML =
                        '<div class="col-12"><div class="alert alert-danger border-0"><i class="bi bi-exclamation-triangle me-2"></i>Failed to load goals.</div></div>';
                }
            }

            async function saveGoal(event) {
                event.preventDefault();
                var form = document.getElementById('goalForm');
                var titleEl = document.getElementById('goalTitle');
                var targetEl = document.getElementById('goalTargetAmount');
                var currentEl = document.getElementById('goalCurrentAmount');
                var startEl = document.getElementById('goalStartDate');
                var endEl = document.getElementById('goalEndDate');
                var id = document.getElementById('goalId').value;
                var submitBtn = document.getElementById('goalSubmitBtn');

                clearFormValidation(form);
                clearModalError(form);

                var title = titleEl.value.trim();
                var targetAmount = parseFloat(targetEl.value);
                var currentAmount = currentEl.value === '' ? 0 : parseFloat(currentEl.value);
                var invalid = false;

                if (!title) {
                    markInvalid(titleEl, 'Title is required.');
                    invalid = true;
                }
                if (targetEl.value === '' || isNaN(targetAmount) || targetAmount < 0) {
                    markInvalid(targetEl, 'Enter a valid target amount.');
                    invalid = true;
                }
                if (currentEl.value !== '' && (isNaN(currentAmount) || currentAmount < 0)) {
                    markInvalid(currentEl, 'Enter a valid current amount.');
                    invalid = true;
                }
                if (startEl.value && endEl.value && endEl.value < startEl.value) {
                    markInvalid(endEl, 'End date must be on or after the start date.');
                    invalid = true;
                }
                if (invalid) {
                    setModalError(form, 'Please fix the highlighted fields.');
                    return;
                }

                var data = {
                    title: title,
                    description: document.getElementById('goalDescription').value.trim() || null,
                    targetAmount: targetAmount,
                    currentAmount: currentAmount,
                    startDate: startEl.value || null,
                    endDate: endEl.value || null,
                    status: document.getElementById('goalStatus').value || 'Active',
                };

                setButtonLoading(submitBtn, true, id ? 'Updating...' : 'Saving...');
                try {
                    await apiFetch(id ? '/api/goals/' + id : '/api/goals', {
                        method: id ? 'PUT' : 'POST',
                        body: JSON.stringify(data),
                    });
                    closeModal(document.getElementById('goalModal'));
                    resetForm(form);
                    showPageFeedback('goalsFeedback', id ? 'Goal updated successfully.' : 'Goal created successfully.');
                    await loadGoals();
                } catch (e) {
                    setModalError(form, 'Failed to save goal: ' + e.message);
                } finally {
                    setButtonLoading(submitBtn, false);
                }
            }

            document.getElementById('goalForm').addEventListener('submit', saveGoal);
            loadGoals();
        </script>
    </body>
</html>
