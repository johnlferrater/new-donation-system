<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admins - Donation System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <meta name="_csrf" th:content="${_csrf?.token}">
  <meta name="_csrf_header" th:content="${_csrf?.headerName}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-red">
    <div class="container">
      <a class="navbar-brand" href="/"><i class="bi bi-heart-fill text-danger"></i> Donation System</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="/goals">Goals</a></li>
          <li class="nav-item"><a class="nav-link" href="/donation-records">Records</a></li>
          <li class="nav-item"><a class="nav-link" href="/donation-history">History</a></li>
          <li class="nav-item"><a class="nav-link" href="/announcements">Announcements</a></li>
          <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" href="/users">Users</a></li>
          <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link active" href="/admins">Admins</a></li>
          <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle"></i> <span sec:authentication="name">account</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <form th:action="@{/logout}" method="post" class="px-2 py-1">
                  <button type="submit" class="btn btn-sm btn-outline-danger w-100">
                    <i class="bi bi-box-arrow-right"></i> Logout
                  </button>
                </form>
              </li>
            </ul>
          </li>
          <li class="nav-item" sec:authorize="!isAuthenticated()"><a class="nav-link" href="/login">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2><i class="bi bi-shield-lock"></i> Admins</h2>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal"><i class="bi bi-plus-lg"></i> Add Admin</button>
    </div>

    <div class="card p-4">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr><th>Admin Name</th></tr>
          </thead>
          <tbody id="adminsTableBody">
            <tr><td class="text-center text-muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add New Admin</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="addForm">
            <div class="mb-3">
              <label class="form-label">Admin Name</label>
              <input type="text" class="form-control" id="admin" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" id="password" required>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="addAdmin()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function loadAdmins() {
      try {
        const admins = await apiFetch('/api/admins');
        const tbody = document.getElementById('adminsTableBody');
        if (admins.length === 0) {
          tbody.innerHTML = '<tr><td class="text-center text-muted">No admins found</td></tr>';
          return;
        }
        tbody.innerHTML = admins.map(a => `<tr><td>${a.admin}</td></tr>`).join('');
      } catch (e) {
        console.error('Failed to load admins:', e);
      }
    }

    async function addAdmin() {
      const data = {
        admin: document.getElementById('admin').value,
        password: document.getElementById('password').value
      };
      try {
        await apiFetch('/api/admins', { method: 'POST', body: JSON.stringify(data) });
        bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
        document.getElementById('addForm').reset();
        loadAdmins();
      } catch (e) {
        alert('Failed to add admin: ' + e.message);
      }
    }

    loadAdmins();
  </script>
</body>
</html>
