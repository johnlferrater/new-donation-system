<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcements - Donation System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <meta name="_csrf" th:content="${_csrf?.token}">
  <meta name="_csrf_header" th:content="${_csrf?.headerName}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-red">
    <div class="container">
      <a class="navbar-brand" href="/"><i class="bi bi-heart-fill text-danger"></i> Donation System</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" href="/dashboard">Dashboard</a></li>
          <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" href="/goals">Goals</a></li>
          <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" href="/donation-records">Records</a></li>
          <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" href="/donation-history">History</a></li>
          <li class="nav-item"><a class="nav-link active" href="/announcements">Announcements</a></li>
          <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" href="/users">Users</a></li>
          <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle"></i> <span sec:authentication="name">account</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <form th:action="@{/logout}" method="post" class="px-2 py-1">
                  <button type="submit" class="btn btn-sm btn-outline-danger w-100">
                    <i class="bi bi-box-arrow-right"></i> Logout
                  </button>
                </form>
              </li>
            </ul>
          </li>
          <li class="nav-item" sec:authorize="!isAuthenticated()"><a class="nav-link" href="/login">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <h2 class="mb-1"><i class="bi bi-megaphone"></i> Announcements</h2>
        <p class="text-muted mb-0">Stay up to date with the latest updates.</p>
      </div>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal"
              sec:authorize="hasRole('ADMIN')"><i class="bi bi-plus-lg"></i> Add Announcement</button>
    </div>

    <div id="announcementsContainer">
      <div class="text-center text-muted">Loading...</div>
    </div>
  </div>

  <div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add Announcement</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="addForm" novalidate>
            <div class="mb-3">
              <label class="form-label">Title <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="title" maxlength="200" required>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Category</label>
                <input type="text" class="form-control" id="category" maxlength="100" placeholder="e.g., Updates">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Status</label>
                <select class="form-select" id="published">
                  <option value="true" selected>Published</option>
                  <option value="false">Draft</option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Message <span class="text-danger">*</span></label>
              <textarea class="form-control" id="message" rows="5" required></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="addAnnouncement()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Announcement</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="editForm" novalidate>
            <input type="hidden" id="editId">
            <div class="mb-3">
              <label class="form-label">Title <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="editTitle" maxlength="200" required>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Category</label>
                <input type="text" class="form-control" id="editCategory" maxlength="100">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Status</label>
                <select class="form-select" id="editPublished">
                  <option value="true">Published</option>
                  <option value="false">Draft</option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Message <span class="text-danger">*</span></label>
              <textarea class="form-control" id="editMessage" rows="5" required></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="updateAnnouncement()">Update</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script th:inline="javascript">
    const isAdmin = /*[[${#authorization.expression('hasRole(''ADMIN'')')}]]*/ false;
  </script>
  <script>
    let announcementsCache = [];

    async function loadAnnouncements() {
      try {
        const announcements = await apiFetch('/api/announcements');
        announcementsCache = announcements || [];
        const container = document.getElementById('announcementsContainer');
        if (announcementsCache.length === 0) {
          container.innerHTML = '<div class="card p-4 text-center text-muted">No announcements available.</div>';
          return;
        }

        if (isAdmin) {
          container.innerHTML = `
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead>
                  <tr>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Status</th>
                    <th>Created/Updated</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  ${announcementsCache.map(a => `
                    <tr>
                      <td>
                        <div class="fw-semibold">${escapeHtml(a.title || '(no title)')}</div>
                        <div class="text-muted small">${escapeHtml((a.message || '').substring(0, 80))}${(a.message || '').length > 80 ? '...' : ''}</div>
                      </td>
                      <td>${escapeHtml(a.category || '-')}</td>
                      <td>${a.published ? '<span class="badge bg-success">Published</span>' : '<span class="badge bg-secondary">Draft</span>'}</td>
                      <td class="small text-muted">${escapeHtml(a.updatedAt ? new Date(a.updatedAt).toLocaleString() : (a.datePosted ? new Date(a.datePosted).toLocaleString() : '-'))}</td>
                      <td class="text-end">
                        <button class="btn btn-sm btn-outline-primary" onclick='openEdit(${JSON.stringify(a).replace(/'/g, "&#39;")})'><i class="bi bi-pencil"></i> Edit</button>
                        ${a.published ? `<button class="btn btn-sm btn-outline-warning" onclick="unpublishAnnouncement(${a.id})"><i class="bi bi-eye-slash"></i> Unpublish</button>` : `<button class="btn btn-sm btn-outline-success" onclick="publishAnnouncement(${a.id})"><i class="bi bi-eye"></i> Publish</button>`}
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteAnnouncement(${a.id})"><i class="bi bi-trash"></i> Delete</button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `;
        } else {
          container.innerHTML = announcementsCache.map(a => `
            <div class="card announcement-card p-4 mb-3">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <h5 class="mb-0">${escapeHtml(a.title || 'Announcement')}</h5>
                ${a.category ? `<span class="badge bg-light text-dark">${escapeHtml(a.category)}</span>` : ''}
              </div>
              <p class="mb-2">${escapeHtml(a.message || '')}</p>
              <small class="text-muted"><i class="bi bi-calendar"></i> ${escapeHtml(a.publishedAt ? new Date(a.publishedAt).toLocaleString() : (a.datePosted ? new Date(a.datePosted).toLocaleString() : '-'))}</small>
            </div>
          `).join('');
        }
      } catch (e) {
        console.error('Failed to load announcements:', e);
        document.getElementById('announcementsContainer').innerHTML = '<div class="alert alert-danger">Failed to load announcements.</div>';
      }
    }

    async function addAnnouncement() {
      const title = document.getElementById('title').value.trim();
      const message = document.getElementById('message').value.trim();
      if (!title || !message) {
        alert('Title and message are required.');
        return;
      }
      const data = {
        title: title,
        message: message,
        category: document.getElementById('category').value.trim() || null,
        published: document.getElementById('published').value === 'true'
      };
      try {
        await apiFetch('/api/announcements', { method: 'POST', body: JSON.stringify(data) });
        const modal = bootstrap.Modal.getInstance(document.getElementById('addModal'));
        if (modal) modal.hide();
        document.getElementById('addForm').reset();
        document.getElementById('published').value = 'true';
        loadAnnouncements();
      } catch (e) {
        alert('Failed to add announcement: ' + e.message);
      }
    }

    function openEdit(a) {
      document.getElementById('editId').value = a.id;
      document.getElementById('editTitle').value = a.title || '';
      document.getElementById('editCategory').value = a.category || '';
      document.getElementById('editMessage').value = a.message || '';
      document.getElementById('editPublished').value = a.published ? 'true' : 'false';
      new bootstrap.Modal(document.getElementById('editModal')).show();
    }

    async function updateAnnouncement() {
      const id = document.getElementById('editId').value;
      const title = document.getElementById('editTitle').value.trim();
      const message = document.getElementById('editMessage').value.trim();
      if (!title || !message) {
        alert('Title and message are required.');
        return;
      }
      const data = {
        title: title,
        message: message,
        category: document.getElementById('editCategory').value.trim() || null,
        published: document.getElementById('editPublished').value === 'true'
      };
      try {
        await apiFetch('/api/announcements/' + id, { method: 'PUT', body: JSON.stringify(data) });
        const modal = bootstrap.Modal.getInstance(document.getElementById('editModal'));
        if (modal) modal.hide();
        loadAnnouncements();
      } catch (e) {
        alert('Failed to update announcement: ' + e.message);
      }
    }

    async function publishAnnouncement(id) {
      if (!confirm('Publish this announcement?')) return;
      try {
        await apiFetch('/api/announcements/' + id + '/publish', { method: 'POST' });
        loadAnnouncements();
      } catch (e) {
        alert('Failed to publish announcement: ' + e.message);
      }
    }

    async function unpublishAnnouncement(id) {
      if (!confirm('Unpublish this announcement? It will no longer be visible to users.')) return;
      try {
        await apiFetch('/api/announcements/' + id + '/unpublish', { method: 'POST' });
        loadAnnouncements();
      } catch (e) {
        alert('Failed to unpublish announcement: ' + e.message);
      }
    }

    async function deleteAnnouncement(id) {
      if (!confirm('Are you sure you want to delete this announcement? This action cannot be undone.')) return;
      try {
        await apiFetch('/api/announcements/' + id, { method: 'DELETE' });
        loadAnnouncements();
      } catch (e) {
        alert('Failed to delete announcement: ' + e.message);
      }
    }

    loadAnnouncements();
  </script>
</body>
</html>
