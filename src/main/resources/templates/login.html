<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login - Donation System', false)}"></head>
<body class="app-body">
  <nav th:replace="~{fragments/layout :: navbar('login')}"></nav>

  <main class="container app-main auth-shell">
    <div class="login-container">
      <div class="card auth-card">
        <p class="page-kicker text-center mb-2">Donation System</p>
        <h1 class="text-center mb-2"><i class="bi bi-box-arrow-in-right me-1"></i>Welcome back</h1>
        <p class="text-center text-muted mb-4">Sign in to your account.</p>

        <div th:if="${param.registered}" class="alert alert-success" role="status">
          <i class="bi bi-check-circle"></i> Account created. You can log in now.
        </div>
        <div th:if="${param.error}" class="alert alert-danger" role="alert">
          <i class="bi bi-exclamation-triangle"></i> Invalid username or password.
        </div>
        <div th:if="${param.logout}" class="alert alert-success" role="status">
          <i class="bi bi-check-circle"></i> You have been logged out.
        </div>

        <form th:action="@{/login}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input type="text" class="form-control" id="username" name="username"
                   autocomplete="username" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>

        <p class="auth-links mb-0">
          <span class="text-muted">Don't have an account?</span>
          <a href="/register">Sign up</a>
        </p>
      </div>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
