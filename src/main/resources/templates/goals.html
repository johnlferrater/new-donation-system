<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Donation Goals - Donation System', true)}"></head>
<body class="app-body">
  <nav th:replace="~{fragments/layout :: navbar('goals')}"></nav>

  <main class="container app-main">
    <header class="page-header mb-4">
      <div class="page-header__copy">
        <p class="page-kicker">Fundraising</p>
        <h1 class="page-title"><i class="bi bi-bullseye me-2"></i>Donation Goals</h1>
        <p class="page-subtitle">Set targets and follow the progress of each fundraising campaign.</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal"
                sec:authorize="hasRole('ADMIN')"><i class="bi bi-plus-lg"></i> Create Goal</button>
      </div>
    </header>

    <div class="row g-4" id="goalsContainer">
      <div class="col-12">
        <div class="card border-0 shadow-sm text-center text-muted py-5">
          <div class="card-body">
            <div class="spinner-border text-primary mb-3" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mb-0">Loading goals...</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addGoalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="addGoalTitle">Add New Goal</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="addForm">
            <div class="mb-3">
              <label class="form-label" for="title">Title</label>
              <input type="text" class="form-control" id="title" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="targetAmount">Target Amount (₱)</label>
              <input type="number" class="form-control" id="targetAmount" step="0.01" min="0" required>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="addGoal()">Save Goal</button>
        </div>
      </div>
    </div>
  </div>

  <footer th:replace="~{fragments/layout :: footer}"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function loadGoals() {
      try {
        const goals = await apiFetch('/api/goals');
        const container = document.getElementById('goalsContainer');
        if (goals.length === 0) {
          container.innerHTML = '<div class="col-12"><div class="card border-0 shadow-sm text-center text-muted py-5"><div class="card-body"><i class="bi bi-bullseye fs-1 mb-3 d-block" style="color: var(--theme-border);"></i><h5>No goals yet</h5><p class="mb-0">Create your first donation goal to get started.</p></div></div></div>';
          return;
        }
        container.innerHTML = goals.map(g => {
          const target = Number(g.targetAmount) || 0;
          const current = Number(g.currentAmount) || 0;
          const pct = target > 0 ? Math.max(0, Math.min(Math.round((current / target) * 100), 100)) : 0;
          return `<div class="col-md-6 col-lg-4">
            <article class="card border-0 shadow-sm h-100">
              <div class="card-body">
                <div class="d-flex align-items-start justify-content-between mb-3">
                  <h2 class="h5 mb-0">${escapeHtml(g.title)}</h2>
                  <span class="badge bg-primary-soft" style="background: var(--theme-soft); color: var(--theme-primary-dark);">${pct}%</span>
                </div>
                <div class="mb-3">
                  <div class="d-flex justify-content-between align-items-baseline mb-2">
                    <span class="text-muted small">Raised</span>
                    <span class="fw-semibold" style="color: var(--theme-primary);">₱${current.toLocaleString()}</span>
                  </div>
                  <div class="d-flex justify-content-between align-items-baseline mb-2">
                    <span class="text-muted small">Target</span>
                    <span class="fw-semibold">₱${target.toLocaleString()}</span>
                  </div>
                </div>
                <div class="progress" style="height: 10px;" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${pct}% funded">
                  <div class="progress-bar" style="width:${pct}%; background: linear-gradient(90deg, var(--theme-primary) 0%, var(--theme-primary-light) 100%);"></div>
                </div>
              </div>
            </article>
          </div>`;
        }).join('');
      } catch (e) {
        console.error('Failed to load goals:', e);
        document.getElementById('goalsContainer').innerHTML = '<div class="col-12"><div class="alert alert-danger border-0"><i class="bi bi-exclamation-triangle me-2"></i>Failed to load goals.</div></div>';
      }
    }

    async function addGoal() {
      const titleEl = document.getElementById('title');
      const targetEl = document.getElementById('targetAmount');
      if (!titleEl || !targetEl) {
        alert('Form fields not found.');
        return;
      }
      const title = titleEl.value.trim();
      const targetAmount = parseFloat(targetEl.value);
      if (!title) {
        alert('Title is required.');
        titleEl.focus();
        return;
      }
      if (isNaN(targetAmount) || targetAmount < 0) {
        alert('Please enter a valid target amount.');
        targetEl.focus();
        return;
      }
      const data = {
        title: title,
        targetAmount: targetAmount,
        currentAmount: 0
      };
      try {
        await apiFetch('/api/goals', { method: 'POST', body: JSON.stringify(data) });
        const modalEl = document.getElementById('addModal');
        const modal = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
        modal.hide();
        const formEl = document.getElementById('addForm');
        if (formEl) formEl.reset();
        alert('Goal created successfully.');
        loadGoals();
      } catch (e) {
        alert('Failed to add goal: ' + e.message);
      }
    }

    loadGoals();
  </script>
</body>
</html>
