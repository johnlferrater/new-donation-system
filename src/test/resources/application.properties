# Tests use an in-memory H2 database so they never need local MySQL credentials.
# This file shadows src/main/resources/application.properties on the test classpath.
spring.datasource.url=jdbc:h2:mem:donationdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

app.bootstrap.admin.username=
app.bootstrap.admin.email=
app.bootstrap.admin.password=
