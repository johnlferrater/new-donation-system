<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donation Records - Donation System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/"><i class="bi bi-heart-fill text-danger"></i> Donation System</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="/goals">Goals</a></li>
          <li class="nav-item"><a class="nav-link active" href="/donation-records">Records</a></li>
          <li class="nav-item"><a class="nav-link" href="/donation-history">History</a></li>
          <li class="nav-item"><a class="nav-link" href="/announcements">Announcements</a></li>
          <li class="nav-item"><a class="nav-link" href="/users">Users</a></li>
          <li class="nav-item"><a class="nav-link" href="/admins">Admins</a></li>
          <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2><i class="bi bi-cash-stack"></i> Donation Records</h2>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal"><i class="bi bi-plus-lg"></i> Add Record</button>
    </div>

    <div class="card p-4">
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr><th>ID</th><th>Donor Name</th><th>Address</th><th>Type</th><th>Date Donated</th></tr>
          </thead>
          <tbody id="recordsTableBody">
            <tr><td colspan="5" class="text-center text-muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add Donation Record</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="addForm">
            <div class="mb-3">
              <label class="form-label">Donor Name</label>
              <input type="text" class="form-control" id="donorName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Donor Address</label>
              <input type="text" class="form-control" id="donorAddress" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Donation Type</label>
              <select class="form-select" id="donationType" required>
                <option value="">Select type...</option>
                <option value="Cash">Cash</option>
                <option value="Check">Check</option>
                <option value="Online">Online</option>
                <option value="In-Kind">In-Kind</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Date Donated</label>
              <input type="date" class="form-control" id="dateDonated" required>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="addRecord()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    async function loadRecords() {
      try {
        const records = await fetch('/api/donation-records').then(r => r.json());
        const tbody = document.getElementById('recordsTableBody');
        if (records.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No records found</td></tr>';
          return;
        }
        tbody.innerHTML = records.map(r => `<tr>
          <td>${r.recordId}</td>
          <td>${r.donorName}</td>
          <td>${r.donorAddress}</td>
          <td><span class="badge bg-secondary">${r.donationType}</span></td>
          <td>${r.dateDonated ? new Date(r.dateDonated).toLocaleDateString() : '-'}</td>
        </tr>`).join('');
      } catch (e) {
        console.error('Failed to load records:', e);
      }
    }

    async function addRecord() {
      const data = {
        donorName: document.getElementById('donorName').value,
        donorAddress: document.getElementById('donorAddress').value,
        donationType: document.getElementById('donationType').value,
        dateDonated: document.getElementById('dateDonated').value
      };
      try {
        const res = await fetch('/api/donation-records', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (!res.ok) {
          const err = await res.text();
          alert('Failed to add record: ' + err);
          return;
        }
        bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
        document.getElementById('addForm').reset();
        loadRecords();
      } catch (e) {
        alert('Failed to add record: ' + e.message);
      }
    }

    loadRecords();
  </script>
</body>
</html>
