<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcements - Donation System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/"><i class="bi bi-heart-fill text-danger"></i> Donation System</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="/goals">Goals</a></li>
          <li class="nav-item"><a class="nav-link" href="/donation-records">Records</a></li>
          <li class="nav-item"><a class="nav-link" href="/donation-history">History</a></li>
          <li class="nav-item"><a class="nav-link active" href="/announcements">Announcements</a></li>
          <li class="nav-item"><a class="nav-link" href="/users">Users</a></li>
          <li class="nav-item"><a class="nav-link" href="/admins">Admins</a></li>
          <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2><i class="bi bi-megaphone"></i> Announcements</h2>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal"><i class="bi bi-plus-lg"></i> Post Announcement</button>
    </div>

    <div id="announcementsContainer">
      <div class="text-center text-muted">Loading...</div>
    </div>
  </div>

  <div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Post Announcement</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="addForm">
            <div class="mb-3">
              <label class="form-label">Message</label>
              <textarea class="form-control" id="message" rows="4" required></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="addAnnouncement()">Post</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    async function loadAnnouncements() {
      try {
        const announcements = await fetch('/api/announcements').then(r => r.json());
        const container = document.getElementById('announcementsContainer');
        if (announcements.length === 0) {
          container.innerHTML = '<div class="text-center text-muted">No announcements yet</div>';
          return;
        }
        container.innerHTML = announcements.map(a => `
          <div class="card announcement-card p-4 mb-3">
            <p class="mb-2">${a.message}</p>
            <small class="text-muted"><i class="bi bi-calendar"></i> ${a.datePosted ? new Date(a.datePosted).toLocaleString() : '-'}</small>
          </div>
        `).join('');
      } catch (e) {
        console.error('Failed to load announcements:', e);
      }
    }

    async function addAnnouncement() {
      const data = {
        message: document.getElementById('message').value,
        datePosted: new Date().toISOString()
      };
      try {
        const res = await fetch('/api/announcements', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (!res.ok) {
          const err = await res.text();
          alert('Failed to post announcement: ' + err);
          return;
        }
        bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
        document.getElementById('addForm').reset();
        loadAnnouncements();
      } catch (e) {
        alert('Failed to post announcement: ' + e.message);
      }
    }

    loadAnnouncements();
  </script>
</body>
</html>
