<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('My Profile - Donation System', true)}"></head>
<body class="app-body">
  <nav th:replace="~{fragments/layout :: navbar('profile')}"></nav>
  <main class="container app-main">
    <header class="page-header">
      <div class="page-header__copy">
        <p class="page-kicker">Account</p>
        <h1 class="page-title"><i class="bi bi-person-circle me-2"></i>My Profile</h1>
        <p class="page-subtitle">View and update your account information.</p>
      </div>
    </header>
    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card surface-card h-100">
          <div class="card-body">
            <h2 class="h5 mb-3">Profile Information</h2>
            <div class="mb-2"><strong>Username:</strong> <span id="profileUsername">-</span></div>
            <div class="mb-2"><strong>Email:</strong> <span id="profileEmail">-</span></div>
            <div class="mb-2"><strong>Full Name:</strong> <span id="profileFullName">-</span></div>
            <div class="mb-2"><strong>Role:</strong> <span id="profileRole">-</span></div>
          </div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="card surface-card h-100">
          <div class="card-body">
            <h2 class="h5 mb-3">Update Profile</h2>
            <form id="profileForm" novalidate>
              <div class="mb-3">
                <label class="form-label" for="fullName">Full Name</label>
                <input type="text" class="form-control" id="fullName" maxlength="150">
              </div>
              <div class="mb-3">
                <label class="form-label" for="email">Email <span class="text-danger">*</span></label>
                <input type="email" class="form-control" id="email" required>
              </div>
              <button type="button" class="btn btn-primary" onclick="updateProfile()">Save Changes</button>
            </form>
          </div>
        </div>
      </div>
      <div class="col-12">
        <div class="card surface-card">
          <div class="card-body">
            <h2 class="h5 mb-3">Change Password</h2>
            <form id="passwordForm" novalidate>
              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label" for="currentPassword">Current Password <span class="text-danger">*</span></label>
                  <input type="password" class="form-control" id="currentPassword" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="newPassword">New Password <span class="text-danger">*</span></label>
                  <input type="password" class="form-control" id="newPassword" minlength="6" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="confirmPassword">Confirm New Password <span class="text-danger">*</span></label>
                  <input type="password" class="form-control" id="confirmPassword" minlength="6" required>
                </div>
              </div>
              <div class="mt-3">
                <button type="button" class="btn btn-primary" onclick="changePassword()">Change Password</button>
              </div>
              <div class="form-text">You must enter your current password before changing it.</div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let currentUser = null;
    async function loadProfile() {
      try {
        currentUser = await apiFetch('/api/users/me');
        document.getElementById('profileUsername').textContent = currentUser.username || '-';
        document.getElementById('profileEmail').textContent = currentUser.email || '-';
        document.getElementById('profileFullName').textContent = currentUser.fullName || '-';
        document.getElementById('profileRole').textContent = currentUser.role || '-';
        document.getElementById('fullName').value = currentUser.fullName || '';
        document.getElementById('email').value = currentUser.email || '';
      } catch (e) {
        alert('Failed to load profile: ' + e.message);
      }
    }
    async function updateProfile() {
      if (!currentUser) return;
      const email = document.getElementById('email').value.trim();
      if (!email) { alert('Email is required.'); return; }
      const data = { email: email, fullName: document.getElementById('fullName').value.trim() || null };
      try {
        await apiFetch('/api/users/' + encodeURIComponent(currentUser.username), { method: 'PUT', body: JSON.stringify(data) });
        alert('Profile updated successfully.');
        loadProfile();
      } catch (e) {
        alert('Failed to update profile: ' + e.message);
      }
    }
    async function changePassword() {
      if (!currentUser) return;
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (!currentPassword || !newPassword || !confirmPassword) { alert('Please fill in all password fields.'); return; }
      if (newPassword !== confirmPassword) { alert('New passwords do not match.'); return; }
      if (currentUser.role === 'ADMIN' && newPassword.length < 12) { alert('Password must be at least 12 characters.'); return; }
      if (currentUser.role !== 'ADMIN' && newPassword.length < 6) { alert('Password must be at least 6 characters.'); return; }
      try {
        await apiFetch('/api/users/me/change-password', { method: 'POST', body: JSON.stringify({ currentPassword: currentPassword, newPassword: newPassword }) });
        alert('Password changed successfully.');
        document.getElementById('passwordForm').reset();
      } catch (e) {
        alert('Failed to change password: ' + e.message);
      }
    }
    loadProfile();
  </script>
</body>
</html>
